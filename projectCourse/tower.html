/** 光点半径：聚焦态 > 浏览态 > 聚焦时暗淡态；实体较多时略缩小便于浏览 */
function nodeDrawRad(axis, mode) {
  const d = _nodeDensityFactor;
  if (mode === "browse") return (axis ? 17 : 10.5) * d;
  if (mode === "dim") return (axis ? 13.5 : 8) * d;
  if (mode === "anchor") return (axis ? 22 : 14) * d;
  if (mode === "cross") return (axis ? 19.5 : 12.5) * d;
  if (mode === "peer") return (axis ? 18.5 : 11.5) * d;
  return (axis ? 19 : 12) * d;
}

function wingNodeColor(wing, deepen = false) {
  const c = WING_NODE[wing];
  if (!c) return null;
  return deepen ? mixHex(c, "#000000", 0.1) : c;
}

function nodeColor(node, deepen = false) {
  const tm = nodeTierMeta(node);
  if (isAxisMilestoneNode(node)) {
    const c = axisMilestoneColor(node);
    return deepen ? mixHex(c, "#000000", 0.18) : c;
  }
  if (tm?.wing === "left" || tm?.wing === "right") {
    return wingNodeColor(tm.wing, deepen);
  }
  const base = tierColor(tm ? tm.id : 5);
  const tr = TRACK_COL[trackKey(node)];
  let c = tr ? mixHex(base, tr, 0.22) : base;
  return deepen ? mixHex(c, "#000000", 0.2) : c;
}

function wingTrackHint(obeId, x, y, hot) {
  if (obeId < 2) return;
  ctx.save();
  ctx.font = `600 ${hot ? 11 : 10}px Outfit,sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.globalAlpha = hot ? 0.88 : 0.72;
  ctx.fillStyle = WING_NODE.left;
  ctx.fillText("左翼 · 场景", x - 82, y + 14);
  ctx.fillStyle = WING_NODE.right;
  ctx.fillText("右翼 · 知识", x + 82, y + 14);
  ctx.restore();
}

function hexToRgba(hex, a) {
  const key = hex + '\0' + a;
  let v = _hexRgbaCache.get(key);
  if (v !== undefined) return v;
  const n = parseInt(hex.slice(1), 16);
  v = `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  _hexRgbaCache.set(key, v);
  return v;
}

function drawBackdrop(cx, cy, w, h, scale) {
  const t = _frameTime;
  const beam = ctx.createLinearGradient(cx, cy + scale * 1.2, cx, cy - scale * 2.2);
  beam.addColorStop(0, "rgba(212,175,55,0)");
  beam.addColorStop(0.35, "rgba(212,175,55,.07)");
  beam.addColorStop(0.55, "rgba(90,159,212,.05)");
  beam.addColorStop(1, "rgba(212,175,55,0)");
  ctx.fillStyle = beam;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "rgba(255,255,255,.04)";
  for (let i = 0; i < 24; i++) {
    const px = (Math.sin(i * 12.7 + t * 0.4) * 0.5 + 0.5) * w;
    const py = (Math.cos(i * 8.3 + t * 0.3) * 0.5 + 0.5) * h;
    ctx.beginPath();
    ctx.arc(px, py, 0.6 + (i % 3) * 0.2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "rgba(120,150,190,.06)";
  ctx.beginPath();
  ctx.ellipse(cx, cy + scale * (MODEL_H_TOTAL * 0.5), scale * MODEL_R * 1.05, scale * 0.38, 0, 0, Math.PI * 2);
  ctx.fill();
  const ground = mixHex(LV_COLORS[5][0], LV_COLORS[1][0], 0.35);
  const gr = ctx.createRadialGradient(cx, cy + scale * (MODEL_H_TOTAL * 0.5), 0, cx, cy + scale * (MODEL_H_TOTAL * 0.5), scale * MODEL_R * 1.12);
  gr.addColorStop(0, hexToRgba(ground, 0.07));
  gr.addColorStop(0.55, hexToRgba(ground, 0.025));
  gr.addColorStop(1, "transparent");
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.ellipse(cx, cy + scale * (MODEL_H_TOTAL * 0.5), scale * MODEL_R * 1.12, scale * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();
}

function projectDeckArc(y, r, ang0, ang1, steps) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const ang = ang0 + (ang1 - ang0) * t;
    const s = toScreen({ x: Math.cos(ang) * r, y, z: Math.sin(ang) * r });
    if (s) pts.push(s);
  }
  return pts;
}

function strokeProjectedArc(pts, color, width, alpha, glow) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.beginPath();
  pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.globalAlpha = alpha;
  ctx.shadowColor = color;
  ctx.shadowBlur = glow ? 14 : 0;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function tierHub3d(tierId) {
  const tier = tierAt(tierId);
  if (!tier) return { x: 0, y: 0, z: 0 };
  return { x: 0, y: tierCenterDeckY(tier), z: 0 };
}

function tierHubScreen(tierId) {
  const s = toScreen(tierHub3d(tierId));
  return s && s.z > -0.9 ? { x: s.x, y: s.y } : null;
}

/** 仅控制塔身外轮廓：浏览可见，聚焦后消失 */
function browseOuterAlpha() {
  if (defocusAnim) return 1 - defocusEase();
  return focusLv ? 0 : 1;
}

/** 柔光路径：层环 / 塔棱 / 中轴 — 与有机连线同系三层光晕 */
function drawLuminousPath(pts, color, alpha, opts) {
  opts = opts || {};
  if (!pts || pts.length < 2 || alpha < 0.008) return;
  const warm = mixHex(color, "#ffffff", 0.48);
  const closed = opts.closed !== false;
  const reduced = _reducedMotion;
  const breathe = opts.breathe === false ? 1 : (reduced ? 1 : 0.9 + Math.sin(_frameTime * 0.55 + (opts.phase ?? 0)) * 0.1);
  const a = alpha * breathe;
  const auraW = opts.auraW ?? STRUCT_GLOW.auraW;
  const midW = opts.midW ?? STRUCT_GLOW.midW;
  const coreW = opts.coreW ?? STRUCT_GLOW.coreW;
  const trace = () => {
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    if (closed) ctx.closePath();
  };
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  const prevOp = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = "lighter";
  trace();
  ctx.strokeStyle = hexToRgba(color, a * 0.11);
  ctx.lineWidth = auraW;
  ctx.stroke();
  trace();
  ctx.strokeStyle = hexToRgba(color, a * 0.26);
  ctx.lineWidth = midW;
  ctx.stroke();
  trace();
  ctx.strokeStyle = hexToRgba(warm, a * 0.52);
  ctx.lineWidth = coreW;
  ctx.stroke();
  ctx.globalCompositeOperation = prevOp;
  ctx.restore();
}

/** 单层大气光雾：纯填充、无描边环，与萤火虫节点同系 */
function drawTierAtmosphere(tier, alphaMul, emphasis) {
  const col = tierDiskColor(tier.lv);
  const y = tier.y1;
  const r = tier.r1 * 0.97;
  const a = alphaMul;
  if (a < 0.015) return;
  const em = emphasis ?? 1;

  const da = TIER_DISK_ALPHA;
  fillProjectedDisc(y, r * 0.92, col, da.mainFill * a * em, col, da.mainStroke * a * em);
  fillWingSector(tier, y, r * 0.86, "left", wingSectorDiskColor("left"), da.wingFill * a * em);
  fillWingSector(tier, y, r * 0.86, "right", wingSectorDiskColor("right"), da.wingFill * a * em);
  const axisCol = mixHex(AXIS_MILESTONE_COL[tier.lv] || AXIS_MILESTONE_COL[5], TIER_DISK_BG, 0.48);
  fillProjectedDisc(y, r * 0.24, axisCol, da.axisFill * a * em, axisCol, da.axisStroke * a * em);
  fillProjectedDisc(y, r * 1.02, col, da.outerFill * a * em, col, da.outerStroke * a * em);
}

/** 聚焦态单层：光雾台面，强度随聚焦角色变化 */
function drawTierFocusLayer(tier, alphaMul, role) {
  if (alphaMul < 0.03) return;
  const isCore = role === "core";
  const isAdj = role === "adj";
  const em = isCore ? 1.08 : isAdj ? 0.82 : 0.62;
  drawTierAtmosphere(tier, alphaMul * em, em);
}

/** 浏览态单层：光雾层叠 */
function drawTierBrowseLayer(tier, structA) {
  const tierMul = 0.82 + (TIER_COUNT - tier.lv) * 0.1;
  drawTierAtmosphere(tier, structA * tierMul, 1);
}

function fillProjectedDisc(y, r, fillColor, fillA, strokeColor, strokeA) {
  const ring = projectDeckArc(y, r, 0, Math.PI * 2, 36);
  if (ring.length < 8) return null;
  let cx = 0, cy = 0;
  ring.forEach(p => { cx += p.x; cy += p.y; });
  cx /= ring.length;
  cy /= ring.length;
  ctx.save();
  ctx.beginPath();
  ring.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  ctx.closePath();
  if (fillA > 0.01) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * viewScale() * 0.44 + 52);
    g.addColorStop(0, hexToRgba(fillColor, fillA * 0.82));
    g.addColorStop(0.55, hexToRgba(fillColor, fillA * 0.36));
    g.addColorStop(1, hexToRgba(fillColor, fillA * 0.09));
    ctx.fillStyle = g;
    ctx.fill();
  }
  if (strokeA > 0.01) {
    ctx.strokeStyle = hexToRgba(strokeColor || fillColor, strokeA);
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
  return { x: cx, y: cy };
}

/** 翼区扇形铺色：把左右颗粒归到固定半区 */
function fillWingSector(tier, y, r, wing, color, alpha) {
  const hub = toScreen({ x: 0, y, z: 0 });
  const ang0 = wing === "left" ? Math.PI * 0.55 : -Math.PI * 0.45;
  const ang1 = wing === "left" ? Math.PI * 1.45 : Math.PI * 0.45;
  const arc = projectDeckArc(y, r, ang0, ang1, 18);
  if (!hub || arc.length < 3) return;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(hub.x, hub.y);
  arc.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.closePath();
  let gx = hub.x, gy = hub.y;
  arc.forEach(p => { gx += p.x; gy += p.y; });
  gx /= arc.length + 1;
  gy /= arc.length + 1;
  const span = Math.hypot(arc[arc.length - 1].x - hub.x, arc[arc.length - 1].y - hub.y) || 48;
  const g = ctx.createRadialGradient(hub.x, hub.y, span * 0.08, gx, gy, span * 0.92);
  g.addColorStop(0, hexToRgba(color, alpha * 0.48));
  g.addColorStop(0.55, hexToRgba(color, alpha * 0.82));
  g.addColorStop(1, hexToRgba(color, alpha * 1.05));
  ctx.fillStyle = g;
  ctx.globalAlpha = 1;
  ctx.fill();
  ctx.restore();
}

/** 有能力/知识翼的层（T2/T3/T5）是否在圆盘左右缘布锚点 */
function tierHasWingAnchors(tierLv) {
  const obe = OBE_TIERS.find(t => t.id === tierLv);
  return !!(obe && ((obe.leftTypes || []).length || (obe.rightTypes || []).length));
}

function wingSectorAngles(wing) {
  if (wing === "scenario") return { ang0: Math.PI * 0.55, ang1: Math.PI * 1.45 };
  return { ang0: -Math.PI * 0.45, ang1: Math.PI * 0.45 };
}

function wingSectorCenter3d(tierLv, wing) {
  const tier = tierAt(tierLv);
  if (!tier || !tierHasWingAnchors(tierLv)) return null;
  const y = tierWingDeckY(tier);
  const { ang0, ang1 } = wingSectorAngles(wing);
  const ang = (ang0 + ang1) / 2;
  const r = radiusAtY(y) * WING_SECTOR_CENTER_R;
  return { x: Math.cos(ang) * r, y, z: Math.sin(ang) * r };
}

function wingSectorCenterScreen(tierLv, wing) {
  const wp = wingSectorCenter3d(tierLv, wing);
  if (!wp) return null;
  const s = toScreen(wp);
  if (!s) return null;
  return { x: s.x, y: s.y, z: s.z };
}

function satelliteBundleTierId(satelliteIds) {
  for (const id of satelliteIds) {
    const n = nodeById(id);
    if (!n || n.type === "course_group" || n.type === "teaching_unit") continue;
    const ent = ENTITY_BY_ID.get(id);
    const tm = nodeTierMeta(n);
    const t = ent?.tierId ?? tm?.id;
    if (t != null && tierHasWingAnchors(t)) return t;
  }
  for (const id of satelliteIds) {
    const ent = ENTITY_BY_ID.get(id);
    if (ent?.tierId != null) return ent.tierId;
    const tm = nodeTierMeta(nodeById(id));
    if (tm?.id != null) return tm.id;
  }
  return null;
}

function resolveBundleWingEndpoint(satelliteIds, wing) {
  if (wing === "scenario" || wing === "knowledge") {
    const tierLv = satelliteBundleTierId(satelliteIds);
    if (tierLv != null) {
      const center = wingSectorCenterScreen(tierLv, wing);
      if (center) return { x: center.x, y: center.y };
    }
  }
  return nodeScreenCentroid(satelliteIds);
}

function wingAnchorDrawAlpha(z, baseAlpha) {
  if (z == null) return baseAlpha;
  if (z > 0.05) return baseAlpha;
  return baseAlpha * Math.max(0.14, Math.min(1, (z + 1.05) / 1.05));
}

function drawWingBundleAnchorRing(x, y, color, alpha) {
  const r = WING_BUNDLE_ANCHOR_RING_R;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineCap = "round";
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.5);
  g.addColorStop(0, hexToRgba(color, 0.32));
  g.addColorStop(0.55, hexToRgba(color, 0.1));
  g.addColorStop(1, "transparent");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r * 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = hexToRgba(mixHex(color, "#ffffff", 0.35), 0.78);
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, r * 0.32, 0, Math.PI * 2);
  ctx.fillStyle = hexToRgba("#ffffff", 0.62);
  ctx.fill();
  ctx.restore();
}

function drawWingBundleAnchors() {
  const relB = defocusRelBlend();
  const anchorNode = activeNodeId ? nodeById(activeNodeId) : null;
  const bundleOn = showAllLinks
    || (anchorNode && shouldBundleLinksForAnchor(anchorNode) && relB > 0.02);
  OBE_TIERS.forEach(obe => {
    if (!tierHasWingAnchors(obe.id)) return;
    const fw = focusLv ? tierFocusWeight(obe.id) : 1;
    let alpha = bundleOn
      ? (0.42 + relB * 0.36) * Math.max(0.35, fw) * NORMAL_LINK_BRIGHTNESS * 1.35
      : (focusLv ? 0.12 + fw * 0.1 : 0.1) * browseOuterAlpha();
    if (alpha < 0.05) return;
    if ((obe.leftTypes || []).length) {
      const pt = wingSectorCenterScreen(obe.id, "scenario");
      if (pt) drawWingBundleAnchorRing(pt.x, pt.y, WING_NODE.left, wingAnchorDrawAlpha(pt.z, alpha));
    }
    if ((obe.rightTypes || []).length) {
      const pt = wingSectorCenterScreen(obe.id, "knowledge");
      if (pt) drawWingBundleAnchorRing(pt.x, pt.y, WING_NODE.right, wingAnchorDrawAlpha(pt.z, alpha));
    }
  });
}

function tierLabelFixedY(tier) {
  if (tier.lv === 1) {
    const cap = t1CapGeom();
    if (cap) return fixedTierLabelY(cap.yMid);
  }
  return fixedTierLabelY(tierCenterYm(tier.lv, tier));
}

function tierLabelRadius(tier) {
  if (tier.lv === 1) {
    const cap = t1CapGeom();
    return cap ? cap.rFloor * 0.88 : MODEL_R * 0.14;
  }
  return tier.r1 * 0.97;
}

/** 塔左缘屏幕 X（固定，不随 rotY 变化） */
function tierPyramidLeftX(tier, gapPx) {
  const r = tierLabelRadius(tier);
  const pitch = Math.max(0.5, Math.cos(VIEW_PITCH));
  return layoutCx - r * viewScale() * pitch - gapPx;
}

/** 艺术字标题：渐变填充 + 细描边光晕 */
function drawArtTierTitle(text, x, y, accent, alpha, size) {
  const font = `900 ${size}px ${TIER_LABEL_FONT}`;
  ctx.font = font;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  const w = ctx.measureText(text).width;
  const g = ctx.createLinearGradient(x, y - size * 0.4, x + w, y + size * 0.35);
  g.addColorStop(0, hexToRgba(mixHex(accent, "#fffef0", 0.62), alpha));
  g.addColorStop(0.45, hexToRgba(accent, alpha));
  g.addColorStop(1, hexToRgba(mixHex(accent, "#1a1208", 0.22), alpha * 0.92));
  ctx.shadowColor = hexToRgba(accent, 0.55);
  ctx.shadowBlur = 16;
  ctx.strokeStyle = hexToRgba(mixHex(accent, "#ffffff", 0.55), alpha * 0.42);
  ctx.lineWidth = 0.75;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = g;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
  return w;
}

/** 层级引导线：自文字侧短距起笔 → 渐淡横桥 → 塔侧光楔 */
function drawTierLabelConnector(x0, x1, y, accent, alpha) {
  if (x1 - x0 < 8) return;
  const lineCol = mixHex(accent, LINK_CENTER, 0.28);
  const stubX = x0 + Math.min(18, (x1 - x0) * 0.12);

  drawLuminousPath(
    [{ x: x0, y }, { x: stubX, y }],
    lineCol, 0.52 * alpha,
    { closed: false, auraW: 5, midW: 1.3, coreW: 0.5, breathe: false },
  );
  drawLuminousPath(
    [{ x: stubX, y }, { x: x1, y }],
    lineCol, 0.3 * alpha,
    { closed: false, auraW: 7, midW: 1.4, coreW: 0.48, breathe: false },
  );

  ctx.save();
  ctx.globalAlpha = 0.9 * alpha;
  ctx.fillStyle = hexToRgba(accent, 0.88);
  ctx.beginPath();
  ctx.arc(x0, y, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x1 + 5, y - 3.5);
  ctx.lineTo(x1 + 5, y + 3.5);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x1, y, 2, 0, Math.PI * 2);
  ctx.fillStyle = hexToRgba(mixHex(accent, "#ffffff", 0.5), 0.82);
  ctx.fill();
  ctx.restore();
}

function drawTierRailNode(x, y, accent, alpha, lv) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  const s = 4.5;
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.lineTo(s * 0.62, 0);
  ctx.lineTo(0, s);
  ctx.lineTo(-s * 0.62, 0);
  ctx.closePath();
  ctx.fillStyle = hexToRgba(mixHex(accent, "#ffffff", 0.35), 0.92);
  ctx.shadowColor = hexToRgba(accent, 0.65);
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.font = '600 8px Outfit, sans-serif';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = hexToRgba(accent, 0.55);
  ctx.fillText(String(lv), 0, 0);
  ctx.restore();
}

function drawTierLabelPill(x, y, w, h, accent, alpha) {
  const rx = x - 5, ry = y - h * 0.5, rw = w + 10, rh = h;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(rx, ry, rw, rh, rh * 0.42);
  else { ctx.rect(rx, ry, rw, rh); }
  const g = ctx.createLinearGradient(rx, ry, rx + rw, ry + rh);
  g.addColorStop(0, hexToRgba(accent, 0.1));
  g.addColorStop(0.55, hexToRgba(accent, 0.045));
  g.addColorStop(1, hexToRgba(accent, 0.018));
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = hexToRgba(accent, 0.16);
  ctx.lineWidth = 0.6;
  ctx.stroke();
  ctx.restore();
}

function tierTitleSize(lv) {
  if (lv === 1) return 23;
  if (lv === 2) return 27;
  if (lv === 3) return 22;
  if (lv === 4) return 21;
  return 20;
}

function tierSubSize(lv) {
  return lv === 2 ? 11 : 10;
}

function formatTierSub(sub) {
  return sub.replace(/\s{2,}/g, " · ");
}

/** 左侧层级标牌：纵轨 + 胶囊标牌 + 短距引导线 */
function drawTierAxisLabels(w) {
  const tiers = [...TIERS].filter(t => TIER_AXIS_LABELS[t.lv]).sort((a, b) => a.lv - b.lv);
  const items = tiers.map(tier => {
    const copy = TIER_AXIS_LABELS[tier.lv];
    const lineY = tierLabelFixedY(tier);
    const role = focusRole(tier.lv);
    const fw = tierFocusWeight(tier.lv);
    let alpha = 1;
    if (focusLv) {
      if (role === "dim") alpha = 0.24 + fw * 0.32;
      else if (role === "adj") alpha = 0.58 + fw * 0.28;
      else alpha = 0.88 + fw * 0.12;
    }
    if (defocusAnim && !focusLv) alpha *= browseOuterAlpha();
    return { tier, copy, lineY, alpha, accent: LV_COLORS[tier.lv][0] };
  }).filter(it => it.alpha >= 0.06);

  if (items.length >= 2) {
    const railCol = mixHex(LINK_CENTER, "#8ec8ff", 0.38);
    drawLuminousPath(
      [{ x: TIER_RAIL_X, y: items[0].lineY }, { x: TIER_RAIL_X, y: items[items.length - 1].lineY }],
      railCol, 0.26,
      { closed: false, auraW: 7, midW: 1.1, coreW: 0.32, breathe: false },
    );
  }

  items.forEach(({ tier, copy, lineY, alpha, accent }) => {
    drawTierRailNode(TIER_RAIL_X, lineY, accent, alpha, tier.lv);

    const textX = TIER_RAIL_X + TIER_TEXT_OFF;
    const titleSize = tierTitleSize(tier.lv);
    const subSize = tierSubSize(tier.lv);
    const hasMid = !!copy.mid;
    const titleY = copy.sub
      ? lineY - (hasMid ? 14 : (tier.lv === 2 ? 7 : 6))
      : lineY;
    const blockH = copy.sub
      ? titleSize + (hasMid ? 28 : (tier.lv === 2 ? 16 : 14))
      : titleSize + 4;

    ctx.save();
    ctx.font = `900 ${titleSize}px ${TIER_LABEL_FONT}`;
    const titleW = ctx.measureText(copy.title).width;
    ctx.font = `500 ${subSize}px Outfit, sans-serif`;
    const midW = hasMid ? ctx.measureText(copy.mid).width : 0;
    const subW = copy.sub ? ctx.measureText(formatTierSub(copy.sub)).width : 0;
    const blockW = Math.max(titleW, midW, subW);
    ctx.restore();

    drawTierLabelPill(textX, lineY, blockW, blockH, accent, alpha * 0.85);
    drawArtTierTitle(copy.title, textX, titleY, accent, alpha, titleSize);

    if (hasMid) {
      ctx.save();
      ctx.globalAlpha = alpha * 0.82;
      ctx.font = `600 ${subSize}px Outfit, sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = hexToRgba(mixHex(accent, "#c4b5fd", 0.35), 0.72);
      ctx.fillText(copy.mid, textX, lineY + 1);
      ctx.restore();
    }

    if (copy.sub) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = `500 ${subSize}px Outfit, sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = hexToRgba(accent, tier.lv === 2 ? 0.66 : 0.58);
      ctx.shadowColor = hexToRgba(accent, 0.22);
      ctx.shadowBlur = 5;
      ctx.fillText(formatTierSub(copy.sub), textX, lineY + (hasMid ? 14 : (tier.lv === 2 ? 11 : 10)));
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    const lineStartX = textX + blockW + 3;
    const lineEndX = tierPyramidLeftX(tier, TIER_LINE_GAP);
    drawTierLabelConnector(lineStartX, lineEndX, lineY, accent, alpha);
  });
}

/** 中轴光柱：各层光晕 + 极淡竖向柔光，与中心里程碑同色系 */
function drawCenterSpine(alpha) {
  if (alpha < 0.02) return;
  const pts = [];
  TIERS.forEach(tier => {
    const y = tierCenterDeckY(tier);
    const axisCol = AXIS_MILESTONE_COL[tier.lv] || AXIS_MILESTONE_COL[5];
    fillProjectedDisc(y, tier.r1 * 0.11, axisCol, 0.095 * alpha, null, 0);
    const s = toScreen({ x: 0, y, z: 0 });
    if (s) pts.push(s);
  });
  if (pts.length < 2) return;
  const col = mixHex(LINK_CENTER, "#5cff9a", 0.5);
  drawLuminousPath(pts, col, alpha * 0.5, {
    closed: false, auraW: 22, midW: 5, coreW: 0, breathe: false,
  });
}

/** 整体浏览：中轴 + 顶/底光晕；不再画会随旋转切换的塔棱线框 */
function drawPyramidOuterOutline() {
  const structA = browseOuterAlpha();
  if (structA < 0.02) return;
  const base = TIERS[0];
  const apex = TIERS.find(t => t.apex);

  drawCenterSpine(0.55 * structA);

  if (apex) {
    const peak = toScreen({ x: 0, y: apex.y1, z: 0 });
    if (peak) {
      ctx.save();
      const g = ctx.createRadialGradient(peak.x, peak.y, 0, peak.x, peak.y, 52);
      g.addColorStop(0, hexToRgba(LV_COLORS[1][0], 0.26 * structA));
      g.addColorStop(0.5, hexToRgba(LV_COLORS[1][0], 0.08 * structA));
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(peak.x, peak.y, 52, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  if (base) {
    fillProjectedDisc(
      base.y0, base.r0 * 1.04,
      mixHex(tierDiskColor(5), "#142030", 0.42),
      0.03 * structA, null, 0,
    );
  }
}

/** 各层椭圆台面：浏览强分层；聚焦保留层环，仅外轮廓消失 */
function drawTierDualShelves() {
  const browse = !focusLv;

  TIERS.forEach(tier => {
    if (tier.apex) return;
    if (browse) {
      const fade = defocusAnim ? browseOuterAlpha() : 1;
      drawTierBrowseLayer(tier, fade);
      return;
    }
    const fw = tierFocusWeight(tier.lv);
    const role = focusRole(tier.lv);
    let ringA;
    if (role === "dim" || fw < 0.22) {
      ringA = 0.2 + fw * 0.28;
    } else if (role !== "core") {
      ringA = 0.34 + fw * 0.24;
    } else {
      ringA = 0.52 + fw * 0.16;
    }
    drawTierFocusLayer(tier, ringA, role);
  });
}

function drawTierCohortDecks() {
  /* 由 drawTierDualShelves 统一绘制 */
}

function drawGlassFace(f, fw, role) {
  const p = f.proj;
  const cols = LV_COLORS[f.lv];
  const isCore = role === "core";
  const nz = p.reduce((s, pt) => s + pt.z, 0) / p.length;
  const shade = 0.06 + (nz + 1) * 0.06;
  ctx.beginPath();
  p.forEach((pt, i) => (i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y)));
  ctx.closePath();

  /* 浏览态台面由 drawTierBrowseLayer 绘制；顶/底四边形不描边（保留点击面） */
  if (f.kind === "top" || f.kind === "base") {
    if (!focusLv) {
      ctx.globalAlpha = 1;
      return;
    }
    if (fw < 0.35) {
      ctx.globalAlpha = 1;
      return;
    }
    if (isCore && f.kind === "top") {
      ctx.fillStyle = hexToRgba(cols[0], 0.04);
      ctx.globalAlpha = 0.06 + fw * 0.08;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    return;
  }

  /* 侧棱面：默认不描边，避免线框抢戏；保留极淡填充供透视与点击 */
  if (PYRAMID_SHELL_MODE === "off") return;

  const grad = ctx.createLinearGradient(p[0].x, p[0].y, p[2]?.x ?? p[1].x, p[2]?.y ?? p[1].y);
  grad.addColorStop(0, hexToRgba(cols[0], isCore ? 0.06 : 0.03 + shade * 0.2));
  grad.addColorStop(1, hexToRgba(cols[1], 0.01));
  ctx.fillStyle = grad;
  const faceA = !focusLv ? 0.028 : 0.012 + fw * 0.06;
  ctx.globalAlpha = faceA;
  ctx.fill();
  if (PYRAMID_SHELL_MODE === "full") {
    ctx.strokeStyle = fw > 0.65 ? hexToRgba(cols[0], 0.9) : hexToRgba(cols[0], 0.35);
    ctx.lineWidth = fw > 0.65 ? 2.4 : 1.1;
    ctx.globalAlpha = !focusLv ? 0.35 : 0.08 + fw * 0.55;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/** 光点：浏览=萤火虫；聚焦=呼吸光源 + 轨道微粒 */
function drawLuminousNode(x, y, col, rad, mode, alpha, opts) {
  opts = opts || {};
  const t = _frameTime;
  const reduced = _reducedMotion;
  const phase = opts.phase != null ? opts.phase : fireflyPhase(x, y);
  const twinkle = reduced ? 1 : 0.88 + Math.sin(t * 2.1 + phase) * 0.12;
  const pulse = mode === "browse"
    ? twinkle
    : (reduced ? 1 : 1 + Math.sin(t * 2.35 + phase) * 0.03);
  const sizeMul = mode === "anchor" ? 1.12 : mode === "cross" ? 1.08 : mode === "focus" ? 1.05 : 1.02;
  const R = rad * pulse * sizeMul;
  const preset = fireflyPreset(mode);

  if (!preset.sharpLight && !_liteMode) {
    const sprite = getNodeSprite(col, mode);
    const scale = R / sprite.baseR;
    const d = sprite.sz * scale;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(sprite.canvas, x - d / 2, y - d / 2, d, d);
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  drawFireflyBody(x, y, R, col, 1, { ...preset, _mode: mode, phase, t, reduced });
  ctx.restore();
}

function drawWingOrbNode(x, y, col, rad, visMode, alpha, wing, nodeId) {
  drawLuminousNode(x, y, col, rad, visMode, alpha, { wing, phase: nodeGlowPhase(nodeId, wing) });
}

function isHotAlpha(isSel, isLink) {
  return isSel || isLink;
}

function updateLayout() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  layoutLabelW = Math.min(210, Math.max(148, w * 0.19));
  const towerW = Math.max(w - layoutLabelW, w * 0.55);
  layoutScale = Math.min((towerW * 0.86) / (MODEL_R * 2.05), (h * 0.88) / MODEL_H_TOTAL);
  layoutCx = layoutLabelW + towerW * 0.5;
  layoutCy = h * LAYOUT_CY_RATIO;
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.closest(".canvas-wrap").getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  updateLayout();
}

function linkPathProgress(highlight) {
  const reduced = _reducedMotion;
  if (linkDefocusActive()) {
    if (reduced) return 0;
    return 1 - defocusEase();
  }
  if (!highlight || !linkAnimFrom) return 1;
  if (reduced) return 1;
  return Math.min(1, (performance.now() - linkAnimFrom) / LINK_DRAW_MS);
}

function linkGrowT(highlight) {
  return linkPathProgress(highlight);
}

/** 连线端点内缩，避免箭头被光点盖住 */
function screenNodePad(nodeId) {
  const anchor = activeNodeId || (defocusAnim?.mode === "node" ? defocusAnim.nodeId : null);
  return nodeId === anchor ? 20 : 16;
}

function trimLinkEnds(x1, y1, x2, y2, padStart, padEnd) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  const trim = padStart + padEnd;
  if (len <= trim + 6) return null;
  const ux = dx / len, uy = dy / len;
  return {
    x1: x1 + ux * padStart,
    y1: y1 + uy * padStart,
    x2: x2 - ux * padEnd,
    y2: y2 - uy * padEnd,
  };
}

/** 有机连线：三次贝塞尔弧 + 光晕拖尾，替代直线虚线箭头 */
function buildLinkCurve(x1, y1, x2, y2, upward, linkKind, seed) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len < 6) return null;
  const ux = dx / len, uy = dy / len;
  const nx = -uy, ny = ux;
  const peer = linkKind === "peer";
  const sign = upward ? 1 : -1;
  const b1 = len * (peer ? 0.05 : 0.13) * sign;
  const b2 = len * (peer ? 0.03 : 0.07) * -sign * 0.65;
  const h1 = (hash01(seed, "c1") - 0.5) * len * (peer ? 0.025 : 0.045);
  const h2 = (hash01(seed, "c2") - 0.5) * len * (peer ? 0.02 : 0.035);
  const t1 = 0.26 + hash01(seed, "t1") * 0.14;
  const t2 = 0.58 + hash01(seed, "t2") * 0.16;
  return {
    p0: { x: x1, y: y1 },
    p1: { x: x1 + ux * len * t1 + nx * (b1 + h1), y: y1 + uy * len * t1 + ny * (b1 + h1) },
    p2: { x: x1 + ux * len * t2 + nx * (b2 + h2), y: y1 + uy * len * t2 + ny * (b2 + h2) },
    p3: { x: x2, y: y2 },
    len,
  };
}

function cubicPoint(c, t) {
  const u = 1 - t;
  const { p0, p1, p2, p3 } = c;
  return {
    x: u * u * u * p0.x + 3 * u * u * t * p1.x + 3 * u * t * t * p2.x + t * t * t * p3.x,
    y: u * u * u * p0.y + 3 * u * u * t * p1.y + 3 * u * t * t * p2.y + t * t * t * p3.y,
  };
}

function sampleLinkCurve(c, grow, steps) {
  const animating = grow < 0.98;
  const hi = _highEdgeCount && !animating;
  const divisor = hi ? 16 : (animating ? 12 : 7);
  const n = Math.max(animating ? 8 : 14, Math.min(animating ? 28 : (hi ? 20 : 52), steps || Math.floor(c.len / divisor)));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = (i / n) * grow;
    if (t > grow + 0.001) break;
    pts.push(cubicPoint(c, t));
  }
  return pts;
}

function strokeCurvePoints(pts) {
  if (pts.length < 2) return;
  ctx.beginPath();
  pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  ctx.stroke();
}

function drawOrganicEdge(x1, y1, x2, y2, upward, highlight, dimmed, opts) {
  opts = opts || {};
  const tierKind = opts.linkKind === "peer" ? "peer" : "cross";
  const st = LINK_STYLE[tierKind];
  const seed = opts.seed || `${x1}|${y1}|${x2}|${y2}`;
  const curve = buildLinkCurve(x1, y1, x2, y2, upward, tierKind, seed);
  if (!curve) return;

  const color = opts.color || LINK_CENTER;
  const warm = mixHex(color, "#ffffff", 0.52);
  let alpha;
  if (highlight) alpha = st.alpha;
  else if (dimmed) alpha = 0.06;
  else alpha = 0.18;
  const brightMul = opts.brightness ?? NORMAL_LINK_BRIGHTNESS;
  alpha *= (opts.alphaScale ?? 1) * brightMul;
  const widthScale = opts.widthScale ?? 1;
  const grow = linkPathProgress(highlight);
  const reduced = _reducedMotion;
  const now = _frameTime;
  const pts = sampleLinkCurve(curve, grow);
  if (pts.length < 2) return;

  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  const prevOp = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = "lighter";

  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    if (i) ctx.lineTo(pts[i].x, pts[i].y);
    else ctx.moveTo(pts[i].x, pts[i].y);
  }

  if (grow >= 0.9 || !highlight) {
    ctx.strokeStyle = hexToRgba(color, alpha * (tierKind === "peer" ? 0.14 : 0.09));
    ctx.lineWidth = (highlight ? st.auraW : st.auraW * 0.45) * widthScale;
    ctx.globalAlpha = 1;
    ctx.stroke();
  }

  ctx.strokeStyle = hexToRgba(color, alpha * (tierKind === "peer" ? 0.38 : 0.26));
  ctx.lineWidth = (highlight ? st.midW : st.midW * 0.55) * widthScale;
  ctx.stroke();

  ctx.strokeStyle = hexToRgba(warm, alpha * 0.82);
  ctx.lineWidth = (highlight ? st.coreW : st.coreW * 0.5) * widthScale;
  ctx.stroke();

  if (tierKind === "peer" && highlight && grow > 0.85 && !_highEdgeCount) {
    const wavePts = [];
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const t = i / Math.max(1, n - 1);
      const wobble = Math.sin(t * Math.PI * 3.2 + now * 2.4 + hash01(seed, "w") * 6) * 1.1;
      const base = cubicPoint(curve, t * grow);
      const tang = cubicPoint(curve, Math.min(grow, t * grow + 0.02));
      const dx = tang.x - base.x, dy = tang.y - base.y;
      const dl = Math.hypot(dx, dy) || 1;
      wavePts.push({ x: base.x + (-dy / dl) * wobble, y: base.y + (dx / dl) * wobble });
    }
    strokeCurvePoints(wavePts);
    ctx.strokeStyle = hexToRgba(warm, alpha * 0.22);
    ctx.lineWidth = 0.45;
    ctx.stroke();
  }

  ctx.globalCompositeOperation = prevOp;

  if (highlight && grow > 0.85 && alpha > 0.1 && !reduced && !linkDefocusActive() && !_highEdgeCount) {
    const phase = (now * st.flow + hash01(seed, "ph")) % 1;
    const headT = Math.min(grow, phase * grow * 0.98 + 0.02);
    const trailN = 2;
    const sprite = getGlowSprite([[0, "#ffffff"], [0.35, hexToRgba(warm, 0.55)], [1, "transparent"]]);
    const prevAlpha = ctx.globalAlpha;
    ctx.globalCompositeOperation = "lighter";
    for (let k = 0; k < trailN; k++) {
      const tt = Math.max(0, headT - k * (tierKind === "peer" ? 0.028 : 0.018));
      const p = cubicPoint(curve, tt);
      const a = alpha * (0.55 - k * 0.08);
      const r = (tierKind === "peer" ? 2.2 : 2.1) + (trailN - k) * 0.28;
      const glow = tierKind === "peer" ? 2.8 : 2.2;
      const d = r * glow * 2;
      ctx.globalAlpha = a;
      ctx.drawImage(sprite, p.x - d / 2, p.y - d / 2, d, d);
    }
    ctx.globalAlpha = prevAlpha;
    ctx.globalCompositeOperation = prevOp;
  }

  if (grow >= 0.9 && alpha > 0.1 && !_highEdgeCount) {
    const tip = cubicPoint(curve, grow);
    const bloom = 6;
    const sprite = getGlowSprite([[0, "#ffffff"], [0.3, hexToRgba(color, 0.579)], [1, "transparent"]]);
    const prevAlpha2 = ctx.globalAlpha;
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = alpha * 0.38;
    const bd = bloom * 2;
    ctx.drawImage(sprite, tip.x - bd / 2, tip.y - bd / 2, bd, bd);
    ctx.globalAlpha = prevAlpha2;
    ctx.globalCompositeOperation = prevOp;
  }

  ctx.restore();
}

function drawLinkTag(mx, my, text, color) {
  if (!SHOW_LINK_POINT_TEXT) return;
  const font = "600 9px Outfit,sans-serif";
  const tw = measureTextWidth(text, font);
  const padX = 7, padY = 4, bh = 14;
  const bx = mx - tw / 2 - padX, by = my - padY - 5, bw = tw + padX * 2;
  reserveLabelBox({ x: bx, y: by, w: bw, h: bh, cx: mx, cy: my - 5 });
  ctx.font = font;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const g = ctx.createLinearGradient(bx, by, bx, by + bh);
  g.addColorStop(0, "rgba(0,0,0,.72)");
  g.addColorStop(1, "rgba(0,0,0,.55)");
  ctx.fillStyle = g;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 7); ctx.fill(); }
  else ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = hexToRgba(color, 0.55);
  ctx.lineWidth = 1;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 7); ctx.stroke(); }
  ctx.fillStyle = hexToRgba(mixHex(color, "#ffffff", 0.35), 0.95);
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  ctx.fillText(text, mx, my - 5);
  ctx.shadowBlur = 0;
}

function drawEdgeWithLabel(x1, y1, x2, y2, upward, e, anchorId, labelAlong, edgeOpts) {
  edgeOpts = edgeOpts || {};
  const tierKind = edgeOpts.linkKind === "peer" ? "peer" : "cross";
  const st = LINK_STYLE[tierKind];
  const seed = edgeOpts.seed || `${e.from}|${e.to}`;
  drawOrganicEdge(x1, y1, x2, y2, upward, true, false, { ...edgeOpts, seed });
  const prog = linkPathProgress(true);
  const relB = defocusRelBlend();
  if (SHOW_LINK_VERB_LABELS && prog > 0.52 && relB > 0.28) {
    const verb = e._hubVerb || edgeVerbLabel(e, anchorId || e.from);
    const color = edgeOpts.color || LINK_CENTER;
    const curve = buildLinkCurve(x1, y1, x2, y2, upward, tierKind, seed);
    const t = labelAlong == null ? 0.46 : labelAlong;
    const mid = curve ? cubicPoint(curve, Math.min(t, prog)) : { x: (x1 + x2) / 2, y: (y1 + y2) / 2 };
    ctx.save();
    ctx.globalAlpha = st.labelA * Math.min(1, prog) * relB;
    drawLinkTag(mid.x, mid.y, verb, color);
    ctx.restore();
  }
}

function screenForNodeId(id, tierFallback) {
  if (id && NODE_POS[id]) {
    const s = toScreen(NODE_POS[id]);
    if (s) return s;
  }
  return centerAnchorScreen(tierFallback);
}

function linkColorForNode(node) {
  const tm = node ? nodeTierMeta(node) : null;
  return linkColorForWing(tm?.wing, node?.track);
}

function parseCouplingPair(fromId, toId) {
  const fromN = nodeById(fromId);
  const toN = nodeById(toId);
  if (!fromN || !toN) return null;
  if (fromN.type === "course_group" && (toN.type === "scenario_granule" || toN.type === "knowledge_granule")) {
    return { groupId: fromId, granuleId: toId };
  }
  if (toN.type === "course_group" && (fromN.type === "scenario_granule" || fromN.type === "knowledge_granule")) {
    return { groupId: toId, granuleId: fromId };
  }
  return null;
}

/** 中轴脊柱：仅此五段保持单线，不参与捆扎 */
const SPINE_TYPE_PAIRS = new Set([
  "course_group\0teaching_unit",
  "teaching_unit\0course_group",
  "teaching_unit\0cognition_course",
  "cognition_course\0teaching_unit",
  "cognition_course\0project_course",
  "project_course\0cognition_course",
  "project_course\0position",
  "position\0project_course",
]);

function isSpineEdgeItem(item) {
  const fromN = nodeById(item.fromId);
  const toN = nodeById(item.toId);
  if (!fromN || !toN) return false;
  return SPINE_TYPE_PAIRS.has(`${fromN.type}\0${toN.type}`);
}

function nodeBundleWing(nodeId) {
  const n = nodeById(nodeId);
  if (!n) return "center";
  if (n.type === "scenario_granule" || n.type === "scenario_unit" || n.type === "scenario_module") return "scenario";
  if (n.type === "knowledge_granule" || n.type === "knowledge_unit" || n.type === "ability_module") return "knowledge";
  const tm = nodeTierMeta(n);
  if (tm?.wing === "left") return "scenario";
  if (tm?.wing === "right") return "knowledge";
  return "center";
}

function bundleGroupKey(item) {
  if (isSpineEdgeItem(item)) return null;
  const fromN = nodeById(item.fromId);
  const toN = nodeById(item.toId);
  if (!fromN || !toN) return null;

  const pair = parseCouplingPair(item.fromId, item.toId);
  if (pair && item.verb === "耦合") {
    const wing = couplingGranuleWing(pair.granuleId) || "center";
    return `couple|${pair.groupId}|${wing}`;
  }

  const fromW = nodeBundleWing(item.fromId);
  const toW = nodeBundleWing(item.toId);
  const hubTypes = new Set([
    "course_group", "teaching_unit", "cognition_course", "project_course", "position",
    "scenario_unit", "knowledge_unit", "scenario_module", "ability_module",
  ]);

  if (hubTypes.has(toN.type) && fromW !== "center") {
    return `in|${item.toId}|${fromN.concept}|${item.verb}|${fromW}`;
  }
  if (hubTypes.has(fromN.type) && toW !== "center") {
    return `out|${item.fromId}|${toN.concept}|${item.verb}|${toW}`;
  }
  if (fromW === toW && fromW !== "center") {
    const aTier = nodeEntityTierId(fromN) ?? 99;
    const bTier = nodeEntityTierId(toN) ?? 99;
    if (aTier > bTier) return `in|${item.toId}|${fromN.concept}|${item.verb}|${fromW}`;
    if (bTier > aTier) return `out|${item.fromId}|${toN.concept}|${item.verb}|${toW}`;
  }
  return `misc|${fromN.concept}|${toN.concept}|${item.verb}|${fromW}|${toW}`;
}

function parseBundleGroupKey(key) {
  const p = key.split("|");
  const type = p[0];
  if (type === "couple") return { type, hubId: p[1], wing: p[2], fromHub: false };
  if (type === "in") return { type, hubId: p[1], peerConcept: p[2], verb: p[3], wing: p[4], fromHub: false };
  if (type === "out") return { type, hubId: p[1], peerConcept: p[2], verb: p[3], wing: p[4], fromHub: true };
  return { type, hubId: null, verb: p[3] || p[4], wing: p[p.length - 1] || "center", fromHub: true };
}

/** 仅中轴四类里程碑聚焦时启用捆扎（课组/颗粒/单元/模块等不捆扎） */
function shouldBundleLinksForAnchor(anchor) {
  return !!(anchor && isAxisMilestoneNode(anchor));
}

function resolveBundleDrawMode(anchor) {
  return shouldBundleLinksForAnchor(anchor) ? "summary" : "none";
}

function bundleSatelliteIds(items, meta) {
  if (meta.type === "couple") return items.map(i => i.granuleId);
  if (meta.fromHub) return items.map(i => i.toId);
  return items.map(i => i.fromId);
}

/** 捆线末端汇总：概念名×N，如 知识颗粒×12 */
function bundleSatelliteConcept(items, groupMeta, satelliteIds) {
  if (groupMeta.peerConcept) return groupMeta.peerConcept;
  for (const id of satelliteIds) {
    const n = nodeById(id);
    if (n?.concept) return n.concept;
    const ent = ENTITY_BY_ID.get(id);
    if (ent?.concept) return ent.concept;
  }
  if (groupMeta.type === "couple") {
    const gid = items.find(i => i.granuleId)?.granuleId;
    const gn = gid ? nodeById(gid) : null;
    if (gn?.concept) return gn.concept;
  }
  if (groupMeta.wing === "scenario") return "场景颗粒";
  if (groupMeta.wing === "knowledge") return "知识颗粒";
  return "翼实体";
}

function drawBundleWingEndLabel(x, y, conceptLabel, count, color) {
  if (!SHOW_LINK_POINT_TEXT || count < 1) return;
  drawLinkTag(x, y, `${conceptLabel}×${count}`, color);
}

function drawBundleCountTag(mx, my, verb, color) {
  if (!SHOW_LINK_POINT_TEXT || !SHOW_LINK_VERB_LABELS) return;

  const padX = 7, padY = 4, bh = 14;
  const bx = mx - tw / 2 - padX, by = my - padY - 5, bw = tw + padX * 2;
  reserveLabelBox({ x: bx, y: by, w: bw, h: bh, cx: mx, cy: my - 5 });
  ctx.font = font;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const g = ctx.createLinearGradient(bx, by, bx, by + bh);
  g.addColorStop(0, "rgba(0,0,0,.78)");
  g.addColorStop(1, "rgba(0,0,0,.58)");
  ctx.fillStyle = g;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 7); ctx.fill(); }
  else ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = hexToRgba(color, 0.62);
  ctx.lineWidth = 1;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 7); ctx.stroke(); }
  ctx.fillStyle = hexToRgba(mixHex(color, "#ffffff", 0.42), 0.96);
  ctx.fillText(text, mx, my - 5);
}

function drawBundleTrunk(x1, y1, x2, y2, upward, color, count, seed, verb) {
  const edgeSeed = seed || `${x1}|${y1}|${x2}|${y2}|bundle`;
  drawOrganicEdge(x1, y1, x2, y2, upward, true, false, {
    color,
    linkKind: "cross",
    seed: edgeSeed,
    widthScale: BUNDLE_WIDTH_SCALE,
    brightness: NORMAL_LINK_BRIGHTNESS,
  });
  const curve = buildLinkCurve(x1, y1, x2, y2, upward, "cross", edgeSeed);
  if (!curve) return null;
  const grow = linkPathProgress(true);
  if (grow > 0.48 && count > 0) {
    const relB = defocusRelBlend();
    ctx.save();
    ctx.globalAlpha = relB * NORMAL_LINK_BRIGHTNESS;
    const mid = cubicPoint(curve, Math.min(grow, 0.44));
    drawBundleCountTag(mid.x, mid.y, verb || "耦合", color);
    ctx.restore();
  }
  return curve;
}

function drawBundleFan(x1, y1, x2, y2, upward, color, seed) {
  drawOrganicEdge(x1, y1, x2, y2, upward, true, false, {
    color,
    linkKind: "cross",
    seed: seed || `${x1}|${y1}|${x2}|${y2}|fan`,
    widthScale: 1.02,
    brightness: NORMAL_LINK_BRIGHTNESS,
  });
}

function drawSpineEdgeSingle(item) {

  drawOrganicEdge(seg.x1, seg.y1, seg.x2, seg.y2, upward, true, false, {

function drawCouplingItemSingle(item, anchorId) {

  drawEdgeWithLabel(seg.x1, seg.y1, seg.x2, seg.y2, upward, { verb, from: fromId, to: toId }, anchorId, 0.46, {
    color: col,
    linkKind,
    seed: `${fromId}|${toId}`,

  });
}

function drawRelationLinkSingle(item, anchorId) {

  else drawCouplingItemSingle(item, anchorId);
}

/** 颗粒翼别：场景颗粒→左翼(能力/场景侧)，知识颗粒→右翼(知识侧) */
function couplingGranuleWing(granuleId) {
  const n = nodeById(granuleId);
  if (!n) return null;
  if (n.type === "scenario_granule") return "scenario";
  if (n.type === "knowledge_granule") return "knowledge";
  return null;
}

function wingBundleColor(wing) {
  return wing === "scenario" ? WING_NODE.left : WING_NODE.right;
}

function nodeScreenCentroid(nodeIds) {
  let sx = 0, sy = 0, n = 0;
  nodeIds.forEach(id => {
    const p = toScreen(NODE_POS[id]);
    if (!p) return;
    sx += p.x;
    sy += p.y;
    n++;
  });
  return n ? { x: sx / n, y: sy / n, n } : null;
}

function bundleGroupColor(items, wing) {
  if (wing === "scenario") return wingBundleColor("scenario");
  if (wing === "knowledge") return wingBundleColor("knowledge");
  return items[0]?.col || LINK_CENTER;
}

function drawGenericBundleGroup(items, groupMeta, mode, extraLane) {
  if (!items.length || !groupMeta.hubId) return;
  const hp = toScreen(NODE_POS[groupMeta.hubId]);
  if (!hp) return;
  const satelliteIds = bundleSatelliteIds(items, groupMeta);
  const wing = groupMeta.wing === "scenario" || groupMeta.wing === "knowledge"
    ? groupMeta.wing : nodeBundleWing(satelliteIds[0]);
  const meta0 = items[0];
  const groupSeed = `${groupMeta.hubId}|${groupMeta.type}|${wing}|${meta0.verb || ""}|${satelliteIds.length}`;
  const wingPt = resolveBundleWingEndpoint(satelliteIds, wing);
  if (!wingPt) return;

  const col = bundleGroupColor(items, wing);
  const verb = meta0.verb;
  const x1 = groupMeta.fromHub ? hp.x : wingPt.x;
  const y1 = groupMeta.fromHub ? hp.y : wingPt.y;
  const x2 = groupMeta.fromHub ? wingPt.x : hp.x;
  const y2 = groupMeta.fromHub ? wingPt.y : hp.y;

  const trunk = drawBundleTrunk(
    x1, y1, x2, y2, meta0.upward, col,
    items.length, groupSeed, verb,
  );
  if (trunk && SHOW_LINK_POINT_TEXT) {
    const relB = defocusRelBlend();
    if (relB > 0.28) {
      const wingX = groupMeta.fromHub ? x2 : x1;
      const wingY = groupMeta.fromHub ? y2 : y1;
      ctx.save();
      ctx.globalAlpha = LINK_STYLE.cross.labelA * relB;
      const conceptLabel = bundleSatelliteConcept(items, groupMeta, satelliteIds);
      drawBundleWingEndLabel(wingX, wingY - 10, conceptLabel, items.length, col);
      ctx.restore();
    }
  }
  if (!trunk || mode !== "star" || groupMeta.type === "couple") return;

  const fanT = BUNDLE_FAN_START;
  const jx = x1 + (x2 - x1) * fanT;
  const jy = y1 + (y2 - y1) * fanT;
  items.forEach(item => {
    const satId = groupMeta.type === "couple" ? item.granuleId
      : (groupMeta.fromHub ? item.toId : item.fromId);
    const pt = toScreen(NODE_POS[satId]);
    if (!pt) return;
    const pad = screenNodePad(satId);
    const dx = pt.x - jx, dy = pt.y - jy;
    const len = Math.hypot(dx, dy) || 1;
    drawBundleFan(
      jx, jy,
      pt.x - (dx / len) * pad * 0.35, pt.y - (dy / len) * pad * 0.35,
      item.upward, col, `${item.fromId}|${item.toId}|fan`,
    );
  });
}

function drawBundledLinkSet(pending, drawSingle, bundleMode) {
  const spine = [];
  const bundleable = [];

  pending.forEach(item => {
    if (isSpineEdgeItem(item)) {
      spine.push(item);
      return;
    }
    const pair = parseCouplingPair(item.fromId, item.toId);
    bundleable.push(
      pair && item.verb === "耦合"
        ? { ...item, groupId: pair.groupId, granuleId: pair.granuleId }
        : item,
    );
  });

  spine.forEach(drawSingle);

  const singles = [];
  const groups = new Map();
  bundleable.forEach(item => {
    const key = bundleGroupKey(item);
    if (!key) {
      singles.push(item);
      return;
    }
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  });

  const entries = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  const n = entries.length;
  entries.forEach(([key, items]) => {
    const meta = parseBundleGroupKey(key);
    if (meta.hubId) registerBundledGroup(items, meta);
  });

  singles.forEach(item => {
    registerNormalLineEndpoints(item);
    drawSingle(item);
  });

  entries.forEach(([key, items], idx) => {
    const meta = parseBundleGroupKey(key);
    if (!meta.hubId) {
      items.forEach(item => {
        registerNormalLineEndpoints(item);
        drawSingle(item);
      });
      return;
    }
    const groupLane = (idx - (n - 1) / 2) * (BUNDLE_LANE_SPREAD * 0.28);
    drawGenericBundleGroup(items, meta, bundleMode, groupLane);
  });
}

function drawPendingRelationLinks(pending, anchor, anchorId) {
  _highEdgeCount = pending.length > 150;
  resetLinkLabelCtx();
  const drawSingle = (item) => drawRelationLinkSingle(item, anchorId);
  if (!shouldBundleLinksForAnchor(anchor)) {
    pending.forEach(drawSingle);
    return;
  }
  drawBundledLinkSet(pending, drawSingle, resolveBundleDrawMode(anchor));
}

/** 点击节点：按向上看/向下看筛选 出/入；跨层线更亮，同层线相对暗淡 */
function drawNodeRelationLinks(nodeId) {
  const ent = ENTITY_BY_ID.get(nodeId);
  const anchor = NODE_BY_ID.get(nodeId);
  if (!ent || !anchor) return;

  const ap = toScreen(NODE_POS[nodeId]);
  if (!ap) return;

  linkHighlightByNode.clear();
  linkNodeAccentColor.clear();
  setNodeLinkHighlight(nodeId, nodeId, "anchor");
  linkNodeAccentColor.set(nodeId, LINK_CROSS_ANCHOR);
  const tm0 = nodeTierMeta(anchor);
  if (tm0) linkedCenterTiers.add(tm0.id);

  if (!_linkClosureCache || _linkClosureCache.nodeId !== nodeId || _linkClosureCache.dir !== dir) {
    const closure = collectPenetrationClosure(nodeId);
    const metaEdges = [];
    for (const e of closure.edges) {
      const fromN = NODE_BY_ID.get(e.fromId);
      const toN = NODE_BY_ID.get(e.toId);
      if (!fromN || !toN) continue;
      const linkKind = linkTierKind(fromN, toN);
      const aTier = nodeEntityTierId(fromN);
      const bTier = nodeEntityTierId(toN);
      const upward = (aTier != null && bTier != null) ? bTier < aTier : toN.level > fromN.level;
      let col;
      if (linkKind === "cross") col = crossTierLinkColor(fromN, toN);
      else col = e.isOut ? linkColorForNode(toN) : linkColorForNode(fromN);
      metaEdges.push({ fromId: e.fromId, toId: e.toId, verb: e.verb, isOut: e.isOut, linkKind, upward, col, sort: linkKind === "peer" ? 0 : 1 });
    }
    metaEdges.sort((a, b) => a.sort - b.sort);
    _linkClosureCache = { nodeId, dir, nodeIds: closure.nodeIds, metaEdges };
  }

  _linkClosureCache.nodeIds.forEach(id => highlightNodeIds.add(id));
  const pending = [];

  for (const me of _linkClosureCache.metaEdges) {
    const fromN = NODE_BY_ID.get(me.fromId);
    const toN = NODE_BY_ID.get(me.toId);
    if (!fromN || !toN) continue;
    const pf = toScreen(NODE_POS[me.fromId]);
    const pt = toScreen(NODE_POS[me.toId]);
    if (!pf || !pt) continue;
    const seg = trimLinkEnds(pf.x, pf.y, pt.x, pt.y, screenNodePad(me.fromId), screenNodePad(me.toId));
    if (!seg) continue;
    setNodeLinkHighlight(me.fromId, nodeId, me.linkKind);
    setNodeLinkHighlight(me.toId, nodeId, me.linkKind);
    const tf = nodeTierMeta(fromN);
    const tt = nodeTierMeta(toN);
    if (tf) linkedCenterTiers.add(tf.id);
    if (tt) linkedCenterTiers.add(tt.id);
    if (me.linkKind === "cross") {
      bumpNodeAccent(me.fromId, me.col);
      bumpNodeAccent(me.toId, me.col);
    }
    pending.push({
      seg, upward: me.upward, verb: me.verb, fromId: me.fromId, toId: me.toId, col: me.col, linkKind: me.linkKind,
      sort: me.sort,
    });
  }

  pending.sort((a, b) => a.sort - b.sort);
  drawPendingRelationLinks(pending, anchor, nodeId);
}

/** 全图连线：按当前看法收集全部出/入边（去重，不含动词标签） */
function collectAllGraphEdges() {
  if (allGraphEdgesCache && allGraphEdgesCacheDir === dir) return allGraphEdgesCache;
  const seen = new Set();
  const edges = [];
  for (const ent of ENTITY_BY_ID.values()) {
    const nodeId = ent.id;
    const anchorTier = ent.tierId;
    const anchorConcept = ent.concept;
    const pushEdge = (fromId, toId, verb, isOut) => {
      if (!fromId || !toId || fromId === toId) return;
      const key = fromId + "\0" + toId + "\0" + verb;
      if (seen.has(key)) return;
      const fromN = NODE_BY_ID.get(fromId);
      const toN = NODE_BY_ID.get(toId);
      if (!fromN || !toN || !NODE_POS[fromId] || !NODE_POS[toId]) return;
      const tf = nodeTierMeta(fromN);
      const tt = nodeTierMeta(toN);
      if (!isDrawableNode(fromN, tf) || !isDrawableNode(toN, tt)) return;
      seen.add(key);
      const linkKind = linkTierKind(fromN, toN);
      const upward = (toN.tierId != null && fromN.tierId != null)
        ? toN.tierId < fromN.tierId
        : toN.level > fromN.level;
      const col = linkKind === "cross"
        ? crossTierLinkColor(fromN, toN)
        : (isOut ? linkColorForNode(toN) : linkColorForNode(fromN));
      edges.push({ fromId, toId, verb, upward, col, linkKind, sort: linkKind === "peer" ? 0 : 1 });
    };
    for (const verb of Object.keys(ent.出 || {})) {
      for (const t of ent.出[verb]) {
        if (!includeOutLink(anchorTier, anchorConcept, t.概念, t.实体)) continue;
        const tid = resolveEntityId(t.概念, t.实体);
        if (tid) pushEdge(nodeId, tid, verb, true);
      }
    }
    for (const verb of Object.keys(ent.入 || {})) {
      for (const s of ent.入[verb]) {
        if (!includeInLink(anchorTier, anchorConcept, s.概念, s.实体)) continue;
        const sid = resolveEntityId(s.概念, s.实体);
        if (sid) pushEdge(sid, nodeId, verb, false);
      }
    }
  }
  edges.sort((a, b) => a.sort - b.sort);
  allGraphEdgesCache = edges;
  allGraphEdgesCacheDir = dir;
  return edges;
}

function drawAllGraphLinks() {
  if (!showAllLinks || !DATA) return;
  resetLinkLabelCtx();
  const edges = collectAllGraphEdges();
  const pending = [];
  edges.forEach(({ fromId, toId, verb, upward, col, linkKind, sort }) => {
    const pf = toScreen(NODE_POS[fromId]);
    const pt = toScreen(NODE_POS[toId]);
    if (!pf || !pt) return;
    const seg = trimLinkEnds(
      pf.x, pf.y, pt.x, pt.y,
      screenNodePad(fromId), screenNodePad(toId),
    );
    if (!seg) return;
    pending.push({ seg, upward, verb, fromId, toId, col, linkKind, sort });
  });
  pending.sort((a, b) => a.sort - b.sort);
  ctx.save();
  drawBundledLinkSet(pending, (item) => {
    if (isSpineEdgeItem(item)) drawSpineEdgeSingle(item);
    else drawCouplingItemSingle(item, null);
  }, "summary");
  ctx.restore();
}

function drawLinks() {
  linkedCenterTiers = new Set();
  const lv = focusLv ?? defocusAnim?.focusLv;
  const nodeId = effectiveRelNodeId();
  if (!lv || !nodeId) return;
  if (!activeNodeId && !linkDefocusActive()) return;
  const relB = defocusRelBlend();
  if (relB <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = relB;
  drawNodeRelationLinks(nodeId);
  ctx.restore();
}

function initTierRail() {}

function refreshTierRail() {}

function linkLevelSet() {
  const s = new Set();
  if (interactionMode === "layer" && focusLv) {
    s.add(focusLv);
    if (focusLv > 1) s.add(focusLv - 1);
    if (focusLv < TIER_COUNT) s.add(focusLv + 1);
    return s;
  }
  if (!activeNodeId) return s;
  const sel = NODE_BY_ID.get(activeNodeId);
  if (!sel) return s;
  const tm = nodeTierMeta(sel);
  if (tm) {
    s.add(tm.id);
    if (tm.id > 1) s.add(tm.id - 1);
    if (tm.id < TIER_COUNT) s.add(tm.id + 1);
  }
  return s;
}

function invalidateAllGraphEdgesCache() {
  allGraphEdgesCache = null;
  allGraphEdgesCacheDir = null;
}

function linkedNodeIds() {
  const relId = effectiveRelNodeId();
  if (relId && (interactionMode === "node" || defocusAnim?.mode === "node")) {
    return relatedNodeIds(relId);
  }
  const s = new Set();
  if (interactionMode === "layer" && focusLv) {
    wingNodesOnTier(focusLv).forEach(n => s.add(n.id));
    if (dir !== "down") centerNodesForTier(focusLv).forEach(n => s.add(n.id));
    return s;
  }
  return s;
}

/** 中轴：萤火虫光晕 + 竖菱形核（浏览/聚焦同系，聚焦也保持菱形） */
function drawAxisMilestoneMarker(x, y, col, rad, visMode, alpha, nodeId) {
  const mode = visMode;
  const t = _frameTime;
  const reduced = _reducedMotion;
  const phase = nodeGlowPhase(nodeId, "center");
  const twinkle = reduced ? 1 : 0.88 + Math.sin(t * 2.1 + phase) * 0.12;
  const pulse = mode === "browse"
    ? twinkle
    : (reduced ? 1 : 1 + Math.sin(t * 2.35 + phase) * 0.03);
  const sizeMul = mode === "anchor" ? 1.14 : mode === "cross" ? 1.1 : mode === "focus" ? 1.08 : 1.04;
  const r = rad * pulse * sizeMul;
  const preset = fireflyPreset(mode);
  const hot = mode === "anchor" || mode === "cross";

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineJoin = "round";

  const diamondH = r * 0.78;
  const diamondW = r * 0.54;
  const diamond = () => {
    ctx.beginPath();
    ctx.moveTo(x, y - diamondH);
    ctx.lineTo(x + diamondW, y);
    ctx.lineTo(x, y + diamondH);
    ctx.lineTo(x - diamondW, y);
    ctx.closePath();
  };

  if (_liteMode) {
    diamond();
    ctx.fillStyle = hexToRgba(mixHex(col, "#ffffff", 0.3), 0.85);
    ctx.globalAlpha = alpha;
    ctx.fill();
    ctx.strokeStyle = hexToRgba("#eafff4", hot ? 0.9 : 0.75);
    ctx.lineWidth = hot ? 1.45 : 1.15;
    diamond();
    ctx.stroke();
    ctx.restore();
    return;
  }

  drawFireflyBody(x, y, r, col, 1, {
    ...preset, _mode: mode, phase, t, rotDrift: 0.08, coreMul: 0, axisDiamond: true, reduced,
  });

  diamond();
  const g = ctx.createRadialGradient(x, y, 0, x, y, diamondH);
  g.addColorStop(0, hexToRgba("#ffffff", hot ? 0.98 : preset.sharpLight ? 0.94 : 0.9));
  g.addColorStop(0.35, hexToRgba(mixHex(col, "#ffffff", 0.45), hot ? 0.92 : preset.sharpLight ? 0.86 : 0.78));
  g.addColorStop(0.7, hexToRgba(col, hot ? 0.72 : preset.sharpLight ? 0.64 : 0.5));
  g.addColorStop(1, hexToRgba(col, 0.14));
  ctx.fillStyle = g;
  ctx.globalAlpha = alpha;
  ctx.fill();

  ctx.strokeStyle = hexToRgba("#eafff4", hot ? 0.9 : preset.sharpLight ? 0.84 : 0.75);
  ctx.lineWidth = hot ? 1.45 : preset.sharpLight ? 1.3 : 1.15;
  diamond();
  ctx.stroke();

  ctx.restore();
}

function drawNodeNameLabelPlaced(item) {
  const { s, px, py, label, isSel, linkClass, col, leader, isAggregate } = item;
  const pad = 6, bh = 16;
  const tw = measureTextWidth(label, item.font);
  const bx = px - tw / 2 - pad, by = py - 15, bw = tw + pad * 2;
  ctx.save();
  if (isAggregate) ctx.globalAlpha = 0.92;
  else if (linkClass === "peer") ctx.globalAlpha = LINK_STYLE.peer.alpha;
  else if (linkClass === "cross") ctx.globalAlpha = LINK_STYLE.cross.labelA;
  if (leader && s) {
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(px, py + 2);
    ctx.strokeStyle = hexToRgba(col, isAggregate ? 0.18 : 0.26);
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.font = item.font;
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  ctx.fillStyle = isAggregate ? "rgba(8,14,28,.9)" : isSel ? "rgba(0,0,0,.92)" : "rgba(0,0,0,.85)";
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 4); ctx.fill(); }
  else ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = isAggregate ? mixHex(col, "#d4af37", 0.45) : isSel ? "#fff" : col;
  ctx.lineWidth = isSel ? 2.5 : isAggregate ? 1.5 : linkClass === "peer" ? 1.5 : 2;
  if (isAggregate) ctx.setLineDash([3, 2]);
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 4); ctx.stroke(); }
  else ctx.strokeRect(bx, by, bw, bh);
  ctx.setLineDash([]);
  ctx.fillStyle = isAggregate ? mixHex(col, "#f8fafc", 0.35) : "#fff";
  ctx.shadowColor = col;
  ctx.shadowBlur = isSel ? 14 : isAggregate ? 6 : linkClass === "peer" ? 4 : 10;
  ctx.fillText(label, px, py);
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawFocusLabels() {
  const lv = focusLv ?? defocusAnim?.focusLv;
  const relNodeId = effectiveRelNodeId();
  const relB = defocusRelBlend();
  const relFocus = !!relNodeId && (linkDefocusActive() || relB > 0.02);
  const nodeFocus = (interactionMode === "node" && activeNodeId) || linkDefocusActive();
  const overviewLinks = showAllLinks && !relFocus && !nodeFocus;
  if ((!lv && !overviewLinks) || camZoom < 1.15) return;

  let linked = linkedNodeIds();
  if (relFocus && relNodeId) linked = relatedNodeIds(relNodeId);
  else if (overviewLinks) linked = new Set(DATA.nodes.map(n => n.id));

  let pool;
  let inLinkView = false;
  if (overviewLinks) {
    pool = DATA.nodes.filter(n => isDrawableNode(n, nodeTierMeta(n)));
    inLinkView = true;
  } else if (nodeFocus) {
    if (relB <= 0.001) return;
    pool = DATA.nodes.filter(n => linked.has(n.id) && isDrawableNode(n, nodeTierMeta(n)));
    inLinkView = true;
  } else if (interactionMode === "layer" && focusLv) {
    pool = DATA.nodes.filter(n => {
      const t = nodeTierMeta(n);
      return t && t.id === focusLv && isDrawableNode(n, t);
    });
  } else return;

  const pad = 6, bh = 16;
  const raw = pool.map(n => {
    const s = toScreen(NODE_POS[n.id]);
    if (!s || s.z <= -0.75) return null;
    if (relFocus && relB > 0.02 && !linked.has(n.id)) return null;
    if (!shouldShowNodeNameLabel(n, linked, inLinkView)) return null;
    const isSel = n.id === activeNodeId;
    const linkClass = linkHighlightClass(n.id);
    const hi = isSel || linkClass === "cross";
    const maxLen = isSel ? 24 : (isAxisMilestoneNode(n) || n.type === "course_group" ? 18 : 14);
    const label = truncateName(n.name, maxLen);
    const font = (hi ? "700" : "500") + " 11px Outfit,sans-serif";
    const tmLbl = nodeTierMeta(n);
    const lane = tmLbl?.wing === "right" ? 1 : tmLbl?.wing === "left" ? -1 : (n.track === "knowledge" ? 1 : -1);
    return {
      n, s, label, font, isSel, linkClass,
      col: nodeColor(n, false), lane,
      priority: nodeLabelPriority(n),
      tierId: tmLbl?.id ?? n.tierId,
      tw: measureTextWidth(label, font),
    };
  }).filter(Boolean);

  const { shown, hidden } = capNodeLabelCandidates(raw);
  const aggregates = buildLabelAggregates(hidden);
  const candidates = [...shown, ...aggregates];

  resetLabelPlacer();
  const placed = [];
  candidates.forEach(c => {
    const preferBelow = !c.isAggregate && c.n?.type === "course_group";
    const slot = findNodeLabelSlot(c.s.x, c.s.y, c.tw, pad, bh, c.lane, c.priority, { preferBelow });
    if (slot) placed.push({ ...c, px: slot.px, py: slot.py, leader: slot.leader });
  });

  ctx.save();
  if (nodeFocus) ctx.globalAlpha = relB;
  placed.forEach(drawNodeNameLabelPlaced);
  ctx.restore();
}

function draw() {
  if (!DATA || !DATA.nodes) return;
  _frameTime = performance.now() * 0.001;
  updateModeBlend();
  updateWeightAnim();
  highlightNodeIds = new Set();
  labelReservedRects = [];
  if ((!activeNodeId || interactionMode !== "node") && !linkDefocusActive()) {
    linkHighlightByNode.clear();
    linkNodeAccentColor.clear();
  }
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  const cx = layoutCx, cy = viewCy(), scale = viewScale();

  if (!dragging) drawBackdrop(cx, cy, w, h, scale);
  drawPyramidOuterOutline();

  hitFaces.length = 0;
  screenNodes.length = 0;

  const faces = buildMeshes().map(f => {
    const proj = f.pts.map(p => {
      const s = toScreen(p);
      return { x: s.x, y: s.y, z: s.z };
    });
    const depth = proj.reduce((s, p) => s + p.z, 0) / proj.length;
    return { ...f, proj, depth };
  }).sort((a, b) => a.depth - b.depth);

  const linkedEarly = linkedNodeIds();
  const relBlend = defocusRelBlend();
  const relNodeId = effectiveRelNodeId();
  const relFocus = !!relNodeId && (linkDefocusActive() || relBlend > 0.02);
  const shelfMul = relFocus ? lerpNum(UNLINKED_SHELF_MUL, 1, 1 - relBlend) : 1;

  faces.forEach(f => {
    const fw = tierFocusWeight(f.lv) * shelfMul;
    drawGlassFace(f, fw, focusRole(f.lv));
    hitFaces.push({ lv: f.lv, depth: f.depth, poly: f.proj.map(q => [q.x, q.y]) });
  });

  drawTierDualShelves();
  if (!dragging) drawWingBundleAnchors();
  if (focusLv && focusRole(focusLv) === "core" && interactionMode === "node" && activeNodeId) {
    const cap = t1CapGeom();
    const anchor = cap ? toScreen({ x: 0, y: cap.yMid, z: 0 }) : { x: cx, y: cy };
    wingTrackHint(focusLv, anchor.x, anchor.y, true);
  }

  const linked = relFocus && relNodeId ? relatedNodeIds(relNodeId) : linkedEarly;
  const relSet = relFocus ? linked : null;

  if (showAllLinks && !relFocus) drawAllGraphLinks();

  let sortedNodes;
  if (_sortedNodeIdsCache && _sortedNodeIdsRotY === rotY) {
    sortedNodes = _sortedNodeIdsCache.map(id => {
      const n = NODE_BY_ID.get(id);
      if (!n) return null;
      const wp = NODE_POS[id];
      if (!wp) return null;
      const s = toScreen(wp);
      return { id, node: n, ...s };
    }).filter(Boolean);
  } else {
    sortedNodes = DATA.nodes.map(n => {
      const wp = NODE_POS[n.id];
      if (!wp) return null;
      const s = toScreen(wp);
      return { id: n.id, node: n, ...s };
    }).filter(Boolean).sort((a, b) => a.z - b.z);
    _sortedNodeIdsCache = sortedNodes.map(sn => sn.id);
    _sortedNodeIdsRotY = rotY;
  }

  const _w = w, _h = h;
  sortedNodes.forEach(sn => {
    if (sn.z < -0.3) return;
    if (sn.x < -60 || sn.x > _w + 60 || sn.y < -60 || sn.y > _h + 60) return;
    const n = sn.node;
    const tm = n._tm || nodeTierMeta(n);
    if (!tm || !isDrawableNode(n, tm)) return;
    const linkClass = relSet ? linkHighlightClass(n.id) : null;
    const isSel = linkClass === "anchor";
    const isCross = linkClass === "cross";
    const isPeer = linkClass === "peer";
    const isHot = isSel || isCross || isPeer;
    const inRelClosure = !relSet || relSet.has(n.id);
    const isOutOfRel = relFocus && relBlend > 0.02 && relSet && !inRelClosure;
    const focusLinked = focusLv ? linked : null;
    const isRelated = isHot || (relFocus
      ? inRelClosure
      : !!(focusLinked && focusLinked.has(n.id)));
    const axis = isAxisMilestoneNode(n);
    const isMilestoneInRel = relFocus && relBlend > 0.02 && axis && inRelClosure && !isOutOfRel;
    const col = nodeColor(n, false);
    const visMode = wingNodeVisualMode(isSel, isCross, isPeer, isRelated, isOutOfRel, isMilestoneInRel);
    let rad = nodeDrawRad(axis, visMode);
    const density = DATA?.nodes?.length > 150 ? 0.82 : DATA?.nodes?.length > 100 ? 0.9 : 1;
    const browseRad = (axis ? 17 : 10.5) * density;
    const browseAlpha = n.type === "position" ? 0.92 : 0.84;
    const hitR = visMode === "browse" || visMode === "dim"
      ? (axis ? 24 : 15)
      : isSel ? (axis ? 30 : 20) : isCross ? 18 : isPeer ? 16 : (axis ? 26 : 18);
    screenNodes.push({
      id: n.id, x: sn.x, y: sn.y, z: sn.z,
      r: hitR,
    });

    const behind = sn.z < -0.25;
    let litAlpha = 1;
    if (isOutOfRel) {
      litAlpha = lerpNum(browseAlpha, UNLINKED_NODE_ALPHA, relBlend);
      rad *= lerpNum(1, UNLINKED_NODE_RAD_SCALE, relBlend);
    } else if (isSel && axis) {
      litAlpha = MILESTONE_NODE_ALPHA;
      rad *= MILESTONE_NODE_RAD_MUL;
    } else if (isMilestoneInRel) {
      litAlpha = MILESTONE_NODE_ALPHA_REL;
      rad *= MILESTONE_NODE_RAD_MUL_REL;
    } else if (isSel) {
      litAlpha = 0.88;
      rad *= 1.1;
    } else if (isCross) litAlpha = behind ? NORMAL_CROSS_NODE_ALPHA * 0.88 : NORMAL_CROSS_NODE_ALPHA;
    else if (isPeer) litAlpha = behind ? NORMAL_PEER_NODE_ALPHA * 0.9 : NORMAL_PEER_NODE_ALPHA;
    else if (!focusLv && !relFocus) litAlpha = browseAlpha;
    else if (isRelated) litAlpha = NORMAL_NODE_ALPHA;
    else litAlpha = browseAlpha;
    let alpha = litAlpha;

    if (defocusAnim && isRelated) {
      const df = defocusEase();
      rad = lerpNum(rad, browseRad, df);
      alpha = lerpNum(alpha, browseAlpha, df);
    }

    if (axis) {
      drawAxisMilestoneMarker(sn.x, sn.y, col, rad, visMode, alpha, n.id);
    } else {
      drawWingOrbNode(sn.x, sn.y, col, rad, visMode, alpha, tm.wing === "left" ? "left" : "right", n.id);
    }
  });

  drawLinks();

  if (!dragging) drawFocusLabels();
  drawTierAxisLabels(w);

  if (focusLv) {
    ctx.font = "500 10px Outfit,sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.textAlign = "left";
    ctx.fillText("点击空白区域退出聚焦", 12, h - 10);
  } else if (showAllLinks) {
    ctx.font = "500 10px Outfit,sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.32)";
    ctx.textAlign = "left";
    ctx.fillText("关系全景预览 · 点击「收起全景」关闭", 12, h - 10);
  }
}

function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${Math.min(255,(n>>16)+255*amt)|0},${Math.min(255,((n>>8)&255)+255*amt)|0},${Math.min(255,(n&255)+255*amt)|0})`;
}
function darken(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${((n>>16)*(1-amt))|0},${(((n>>8)&255)*(1-amt))|0},${((n&255)*(1-amt))|0})`;
}

function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function pickNode(mx, my) {
  let best = null, bestD = 1e9;
  for (const sn of [...screenNodes].sort((a, b) => b.z - a.z)) {
    const d = Math.hypot(mx - sn.x, my - sn.y);
    if (d <= sn.r && d < bestD) { bestD = d; best = sn.id; }
  }
  return best;
}

function pickLayer(mx, my) {
  for (const f of [...hitFaces].sort((a, b) => b.depth - a.depth)) {
    if (pointInPoly(mx, my, f.poly)) return f.lv;
  }
  return null;
}

function loop() {
  _liteMode = dragging;
  updateCam();
  if (autoSpin && !paused && !dragging) rotY += spinVel;
  const isIdle = (!autoSpin || paused) && !dragging && !camAnim;
  if (isIdle) {
    const now = performance.now();
    if (now - _lastDrawTime < 50) { requestAnimationFrame(loop); return; }
    _lastDrawTime = now;
  } else {
    _lastDrawTime = performance.now();
  }
  draw();
  requestAnimationFrame(loop);
}

function applyWheelZoom(deltaY) {
  camAnim = null;
  markViewChanging(400);
  const step = Math.pow(1.09, -deltaY / 100);
  camZoom = Math.max(CAM_ZOOM_MIN, Math.min(CAM_ZOOM_MAX, camZoom * step));
  if (focusLv) camCyOff = cyOffForLv(focusLv, camZoom);
}

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  applyWheelZoom(e.deltaY);
}, { passive: false });

canvas.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  updateNodeTooltip(null);
  dragging = true;
  camAnim = null;
  dragX = e.clientX;
  dragY = e.clientY;
  ptrDownX = e.clientX;
  ptrDownY = e.clientY;
  dragDist = 0;
  canvas.classList.add("dragging");
  canvas.setPointerCapture(e.pointerId);
});
const nodeTooltipEl = document.getElementById("node-tooltip");

function updateNodeTooltip(nodeId, clientX, clientY) {
  if (!nodeTooltipEl) return;
  if (!nodeId) {
    nodeTooltipEl.hidden = true;
    canvas.style.cursor = "";
    return;
  }
  const n = nodeById(nodeId);
  if (!n) {
    nodeTooltipEl.hidden = true;
    canvas.style.cursor = "";
    return;
  }
  nodeTooltipEl.textContent = n.name;
  nodeTooltipEl.hidden = false;
  nodeTooltipEl.style.left = `${clientX + 14}px`;
  nodeTooltipEl.style.top = `${clientY + 14}px`;
  canvas.style.cursor = "pointer";
}

canvas.addEventListener("pointermove", e => {
  if (!dragging) {
    const rect = canvas.getBoundingClientRect();
    updateNodeTooltip(pickNode(e.clientX - rect.left, e.clientY - rect.top), e.clientX, e.clientY);
    return;
  }
  markViewChanging(120);
  const dx = e.clientX - dragX;
  const dy = e.clientY - dragY;
  rotY += dx * DRAG_ROT_SENS;
  camCyOff += dy * DRAG_PAN_SENS;
  clampCamCyOff();
  dragX = e.clientX;
  dragY = e.clientY;
  dragDist = Math.max(dragDist, Math.hypot(e.clientX - ptrDownX, e.clientY - ptrDownY));
});
canvas.addEventListener("pointerleave", () => updateNodeTooltip(null));
canvas.addEventListener("pointerup", e => {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove("dragging");
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener("pointercancel", () => {
  dragging = false;
  canvas.classList.remove("dragging");
});
canvas.addEventListener("click", e => {
  const blocked = dragDist > 8;
  dragDist = 0;
  if (blocked) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const nodeId = pickNode(mx, my);
  if (nodeId) { selectNode(nodeId); return; }
  const lv = pickLayer(mx, my);
  if (lv) {
    const centers = centerNodesForTier(lv);
    if (centers.length > 1) { selectCenterTier(lv); return; }
    if (centers.length === 1) { selectNode(centers[0].id); return; }
    selectLayer(lv);
    return;
  }
  if (focusLv) exitFocus();
});

function syncViewDirButton() {
  const btn = document.getElementById("btn-dir");
  if (btn) btn.textContent = dir === "down" ? "↓ 正向拆解" : "↑ 逆向追溯";
}

function syncAllLinksButton() {
  const btn = document.getElementById("btn-all-links");
  if (!btn) return;
  btn.classList.toggle("on", showAllLinks);
  btn.textContent = showAllLinks ? "收起全景" : "关系全景";
}

function applyViewDirChange() {
  syncViewDirButton();
  invalidateAllGraphEdgesCache();
  refreshTierRail();
  linkAnimFrom = performance.now();
  if (activeNodeId) {
    const node = NODE_BY_ID.get(activeNodeId);
    if (node && isDownViewHiddenNode(node)) {
      activeNodeId = null;
      if (focusLv) {
        interactionMode = "layer";
        selectLayer(focusLv);
      } else {
        setViewMode("overview");
        updateDetailPanel("layer", { tierId: focusLv });
        renderFocusBodyOverview();
      }
      return;
    }
    selectNode(activeNodeId);
    setViewMode("node");
  } else if (activeLv) {
    renderLayerHead(activeLv);
    if (interactionMode === "layer") selectLayer(activeLv);
  }
}

document.getElementById("btn-all-links").addEventListener("click", () => {
  showAllLinks = !showAllLinks;
  syncAllLinksButton();
  if (showAllLinks) {
    invalidateAllGraphEdgesCache();
    linkAnimFrom = performance.now();
  }
});

document.getElementById("btn-dir").addEventListener("click", () => {
  dir = dir === "down" ? "up" : "down";
  localStorage.setItem("obe-dir", dir);
  applyViewDirChange();
});

if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  autoSpin = false; paused = true; rotY = 0.55;
}

function findConceptAnchorNode(concept) {
  if (!DATA) return null;
  if (concept === "专业认知课" && DATA.meta?.cognitionCourse) {
    const id = resolveEntityId(concept, DATA.meta.cognitionCourse);
    if (id) return NODE_BY_ID.get(id) || null;
  }
  return DATA.nodes.find(n => n.concept === concept) || null;
}

function findDefaultCognitionCourseNode() {
  if (!DATA) return null;
  const preferred = "数据结构与算法（SJ.J）";
  const prefId = resolveEntityId("专业认知课", preferred);
  if (prefId) {
    const n = NODE_BY_ID.get(prefId);
    if (n) return n;
  }
  return DATA.nodes.find(n => n.type === "cognition_course") || null;
}

function selectDefaultEntry() {
  const concept = "专业认知课";
  const node = findDefaultCognitionCourseNode();
  if (node && !isDownViewHiddenNode(node)) {
    selectNode(node.id);
    return;
  }
  selectLayer(conceptToTierWing(concept).tierId);
}

function initApp() {
  document.documentElement.classList.toggle("hide-link-point-text", !SHOW_LINK_POINT_TEXT);
  refreshNodeLayout();
  initTierRail();
  selectDefaultEntry();
  resize();
  if (!window._pyramidResizeBound) {
    window.addEventListener("resize", resize);
    window._pyramidResizeBound = true;
  }
  loop();
  syncViewDirButton();
  syncAllLinksButton();
  if (dir === "down") refreshTierRail();
}

boot();
</script>
