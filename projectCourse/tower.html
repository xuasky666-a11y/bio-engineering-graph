<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>方案一 · 金字塔双轨 · OBE架构</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600;700;900&family=Outfit:wght@400;500;600&family=Syne:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Outfit,system-ui,sans-serif;background:#030712;color:#f8fafc;font-size:15px}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 55% 45% at 50% 38%,rgba(90,159,212,.12),transparent 60%),
    radial-gradient(ellipse 80% 70% at 20% 80%,rgba(212,175,55,.1),transparent 50%),
    radial-gradient(ellipse 60% 50% at 85% 25%,rgba(94,179,232,.08),transparent 45%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 48px),
    repeating-linear-gradient(0deg,rgba(255,255,255,.008) 0 1px,transparent 1px 48px);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 90% 80% at 50% 50%,transparent 40%,rgba(0,0,0,.55) 100%);
}
.ctrl-btn{
  font-size:11px;padding:6px 10px;border-radius:7px;
  border:1px solid rgba(212,175,55,.35);color:#d4af37;background:rgba(212,175,55,.08);
  cursor:pointer;font-family:inherit;transition:.2s;white-space:nowrap;
}
.ctrl-btn:hover{background:rgba(212,175,55,.18)}
.ctrl-btn.on{background:linear-gradient(135deg,#d4af37,#9a7b2e);color:#0a0806;border-color:#d4af37;font-weight:600}
.shell{
  position:relative;z-index:1;
  display:grid;grid-template-columns:minmax(0,62%) minmax(320px,38%);
  height:100vh;
}
.pyramid-pane{
  position:relative;width:100%;height:100vh;overflow:hidden;
}
.tier-rail{display:none}
.canvas-wrap{position:relative;min-width:0;height:100%;overflow:hidden}
#pyramid-canvas{display:block;width:100%;height:100%;cursor:grab}
#pyramid-canvas.dragging{cursor:grabbing}
.tier-rail{
  display:none;
}
.detail-pane{
  width:100%;height:100vh;
  border-left:1px solid rgba(255,255,255,.06);
  background:linear-gradient(160deg,rgba(15,23,42,.97),rgba(2,6,23,.99));
  padding:24px 28px 20px;
  overflow-x:hidden;overflow-y:auto;
  display:flex;flex-direction:column;gap:16px;
  font-size:15px;
  font-family:"Noto Serif SC","Source Han Serif SC",serif;
}
.panel-global{flex-shrink:0}
.panel-global-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.panel-global h1{
  font-family:Cinzel,serif;font-size:clamp(1.35rem,2.2vw,1.75rem);font-weight:500;line-height:1.3;
  background:linear-gradient(135deg,#f5e6c8,#d4af37);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  word-break:keep-all;flex:1;min-width:0;
}
.panel-global-ctrl{display:flex;gap:6px;flex-shrink:0}
.panel-global .view-mode{display:none}
/* 关系链展示 — focus-body */
.rel-flow{
  display:flex;flex-direction:column;gap:12px;
  padding:14px 15px 15px;border-radius:12px;
  background:
    linear-gradient(145deg,rgba(212,175,55,.07) 0%,rgba(255,255,255,.02) 42%,rgba(82,222,146,.04) 100%),
    rgba(6,10,20,.72);
  border:1px solid rgba(212,175,55,.2);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    inset 0 0 28px rgba(212,175,55,.04),
    0 8px 28px rgba(0,0,0,.28);
  position:relative;overflow:hidden;
}
.rel-flow::before{
  content:"";position:absolute;inset:7px;border-radius:8px;
  border:1px dashed rgba(212,175,55,.14);pointer-events:none;
}
.rel-flow::after{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,.35),transparent);
  pointer-events:none;
}
.rel-block{position:relative;z-index:1;padding:0;background:transparent;border:none}
.rel-head{
  display:flex;align-items:flex-start;gap:0;
  margin-bottom:10px;
}
.rel-head-inner{
  display:flex;align-items:flex-start;gap:10px;width:100%;
}
.rel-dir-badge{
  flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:9px;
}
.rel-dir-in{
  color:#7dffc4;background:linear-gradient(145deg,rgba(66,224,138,.22),rgba(66,224,138,.08));
  border:1px solid rgba(82,222,146,.5);
  box-shadow:0 0 18px rgba(66,224,138,.18),inset 0 1px 0 rgba(255,255,255,.12);
}
.rel-dir-out{
  color:#ffe9a8;background:linear-gradient(145deg,rgba(240,208,96,.2),rgba(240,208,96,.07));
  border:1px solid rgba(240,208,96,.48);
  box-shadow:0 0 18px rgba(240,208,96,.14),inset 0 1px 0 rgba(255,255,255,.1);
}
.rel-svg{display:block;flex-shrink:0}
.rel-svg-block{width:20px;height:20px}
.rel-svg-fold{width:14px;height:14px;transition:transform .22s cubic-bezier(.4,0,.2,1)}
.rel-flow-ico{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.rel-in .rel-flow-ico{filter:drop-shadow(0 0 6px rgba(66,224,138,.45))}
.rel-out .rel-flow-ico{filter:drop-shadow(0 0 6px rgba(240,208,96,.38))}
.rel-head-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.rel-head-title{
  font-size:13px;font-family:Outfit,sans-serif;font-weight:700;letter-spacing:.08em;
  color:rgba(241,245,249,.95);
}
.rel-head-sub{
  font-size:11px;line-height:1.45;color:rgba(148,163,184,.72);
  font-family:"Noto Serif SC",serif;letter-spacing:.02em;
}
.rel-icon{display:none}
.rel-body{
  padding:10px 11px;border-radius:9px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.07);
}
.rel-in .rel-body{
  border-color:rgba(82,222,146,.28);
  box-shadow:inset 4px 0 0 rgba(82,222,146,.62),inset 0 1px 0 rgba(255,255,255,.04);
}
.rel-out .rel-body{
  border-color:rgba(240,208,96,.28);
  box-shadow:inset 4px 0 0 rgba(240,208,96,.58),inset 0 1px 0 rgba(255,255,255,.04);
}
.rel-groups{display:flex;flex-direction:column;gap:12px}
.rel-group{
  position:relative;display:flex;flex-direction:column;gap:6px;
  padding-left:12px;
}
.rel-group::before{
  content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;
  background:linear-gradient(180deg,rgba(212,175,55,.55),rgba(212,175,55,.12));
}
.hide-link-point-text .rel-verb{display:none}
.rel-verb{
  display:inline-block;align-self:flex-start;
  padding:3px 10px;border-radius:999px;
  font-size:11px;font-family:Outfit,sans-serif;font-weight:600;letter-spacing:.06em;
  color:rgba(248,228,168,.96);
  background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(212,175,55,.08));
  border:1px solid rgba(212,175,55,.34);
  box-shadow:0 1px 8px rgba(0,0,0,.2);
}
.rel-items{display:flex;flex-direction:column;gap:5px}
.rel-chip{
  flex:1;min-width:0;
  display:flex;align-items:flex-start;gap:10px;
  padding:9px 12px 9px 10px;border-radius:8px;
  font-size:13px;line-height:1.58;color:rgba(226,232,240,.92);
  font-family:"Noto Serif SC",serif;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-left-width:3px;
  transition:border-color .2s ease,background .2s ease,box-shadow .2s ease;
}
.rel-chip-text{flex:1;min-width:0}
.rel-in .rel-chip{
  border-left-color:rgba(82,222,146,.72);
  background:linear-gradient(90deg,rgba(66,224,138,.07),rgba(255,255,255,.02) 28%);
}
.rel-out .rel-chip{
  border-left-color:rgba(240,208,96,.68);
  background:linear-gradient(90deg,rgba(240,208,96,.06),rgba(255,255,255,.02) 28%);
}
.rel-in .rel-flow-ico{color:#8dffd0}
.rel-out .rel-flow-ico{color:#ffe9a8}
.rel-tree-summary:hover .rel-chip,
.rel-tree-leaf:hover .rel-chip{
  border-color:rgba(255,255,255,.14);
  box-shadow:0 4px 16px rgba(0,0,0,.24);
}
.rel-chip .rel-concept{font-style:normal;font-weight:700;flex-shrink:0}
.rel-chip .rel-name{color:rgba(203,213,225,.88);word-break:break-word}
.rel-empty{
  font-size:13px;color:rgba(148,163,184,.45);font-style:italic;
  padding:8px 10px;border-radius:7px;
  background:rgba(0,0,0,.2);border:1px dashed rgba(255,255,255,.08);
}
.rel-chip-wrap{display:flex;flex-direction:column;gap:5px}
.rel-tree-leaf,.rel-tree-branch{margin:0}
.rel-node-row,.rel-tree-summary,.rel-tree-leaf{
  display:flex;align-items:flex-start;gap:4px;
}
.rel-tree-summary{
  cursor:pointer;list-style:none;outline:none;
  border-radius:8px;
  transition:background .2s ease;
}
.rel-tree-summary::-webkit-details-marker{display:none}
.rel-tree-summary:focus-visible{outline:1px solid rgba(212,175,55,.45);outline-offset:2px}
.rel-tree-summary:hover{background:rgba(255,255,255,.03)}
.rel-fold-slot{
  flex-shrink:0;width:18px;padding-top:11px;
  display:flex;align-items:flex-start;justify-content:center;
  color:rgba(148,163,184,.42);
}
.rel-fold-slot--blank{visibility:hidden;pointer-events:none}
.rel-in .rel-tree-summary:hover .rel-fold-slot{color:rgba(125,255,200,.85)}
.rel-out .rel-tree-summary:hover .rel-fold-slot{color:rgba(255,233,168,.82)}
.rel-tree-branch[open]>.rel-tree-summary .rel-svg-fold{transform:rotate(90deg)}
.rel-nested{
  position:relative;
  margin:6px 0 4px 11px;padding:8px 0 4px 16px;
}
.rel-nested::before{
  content:"";position:absolute;left:0;top:6px;bottom:8px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,rgba(82,222,146,.45),rgba(82,222,146,.08));
}
.rel-out .rel-nested::before{
  background:linear-gradient(180deg,rgba(240,208,96,.42),rgba(240,208,96,.08));
}
@media (prefers-reduced-motion:reduce){
  .rel-svg-fold,.rel-chip,.rel-tree-summary{transition:none}
}
.rel-flow-empty,.focus-graph-desc{
  font-size:13px;color:rgba(148,163,184,.55);line-height:1.7;margin:0;
}
.panel-focus-head{margin-bottom:0}
.panel-focus-head .entity-name{
  font-family:Cinzel,"Noto Serif SC",serif;font-size:1.05rem;line-height:1.45;
  color:#f5e6c8;margin:0 0 12px;letter-spacing:.05em;
}
.panel-focus-head .entity-concept{
  font-style:normal;font-weight:700;font-family:Outfit,"Noto Sans SC",sans-serif;
  letter-spacing:.02em;
}
.panel-focus-head .entity-sep{
  color:rgba(148,163,184,.42);margin:0 8px;font-weight:400;
}
.panel-focus-head .entity-title-name{color:#f5e6c8;font-weight:500}
.panel-focus-rel{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06)}
.panel-focus-rel h5{font-size:12px;letter-spacing:.06em;color:rgba(212,175,55,.8);margin-bottom:8px;font-family:Outfit,sans-serif}
.panel-layer{
  flex-shrink:0;padding:0 0 4px;
  background:transparent;border:none;
}
.layer-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;margin-bottom:14px}
.layer-head .lv-tag{
  font-family:Cinzel,serif;font-size:2rem;font-weight:700;color:var(--accent,#d4af37);
}
.layer-head h2{font-family:Cinzel,serif;font-size:1.25rem;font-weight:500;color:#f1f5f9}
.layer-head .hint{font-size:14px;color:rgba(255,255,255,.5);width:100%}
.layer-meta{display:flex;flex-direction:column;gap:14px}
.meta-row label{
  display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(212,175,55,.85);margin-bottom:6px;
}
.meta-row p{font-size:16px;line-height:1.65;color:rgba(226,232,240,.92)}
.panel-point{
  flex:1;min-height:0;overflow:visible;
  padding:0;background:transparent;border:none;
}
.panel-point .placeholder{font-size:14px;color:rgba(255,255,255,.58);line-height:1.85;font-weight:500}
.panel-point h4{
  font-family:Cinzel,serif;font-size:1.2rem;line-height:1.5;color:#f5e6c8;margin-bottom:12px;
}
.panel-point .track-badge{
  display:inline-block;font-size:13px;padding:5px 10px;border-radius:6px;margin-bottom:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
}
.panel-point .track-badge.s{color:#7dd3fc;border-color:rgba(125,211,252,.3)}
.panel-point .track-badge.c{color:#6ee7b7;border-color:rgba(110,231,183,.3)}
.panel-point .track-badge.k{color:#fcd34d;border-color:rgba(252,211,77,.3)}
.panel-point .track-badge.e{color:#c4b5fd;border-color:rgba(196,181,253,.3)}
.panel-point .edge-list{margin-top:10px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.panel-point .edge-item{
  font-size:14px;line-height:1.5;padding:10px 12px;border-radius:6px;
  background:rgba(255,255,255,.04);border-left:3px solid rgba(255,255,255,.15);
}
.panel-point .edge-item.up{border-left-color:#d4af37}
.panel-point .edge-item.down{border-left-color:#5eb3e8}
.panel-point .edge-item em{font-style:normal;color:rgba(212,175,55,.9);margin-right:6px;font-size:11px}
.panel-point ul.bullets{margin-top:8px;font-size:14px;color:#94a3b8;line-height:1.55;list-style:none}
.panel-point ul.bullets li{margin-bottom:4px;padding-left:10px;border-left:2px solid rgba(212,175,55,.35)}
@media(max-width:960px){
  html,body{overflow:auto}
  .shell{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto;min-height:100vh}
  .pyramid-pane{grid-template-columns:1fr}
  .tier-rail{display:none}
  .pyramid-pane,.detail-pane{width:100%}
  .detail-pane{height:auto;min-height:50vh}
}
.node-tooltip{
  position:fixed;z-index:9999;pointer-events:none;
  max-width:min(360px,72vw);padding:8px 12px;border-radius:8px;
  font:500 12px/1.5 Outfit,"Noto Sans SC",sans-serif;color:#f8fafc;
  background:rgba(6,12,24,.94);border:1px solid rgba(212,175,55,.45);
  box-shadow:0 8px 28px rgba(0,0,0,.45);
  transform:translate(0,0);
}
.node-tooltip[hidden]{display:none}
</style>
</head>
<body>
<div class="shell">
  <section class="pyramid-pane" aria-label="三维金字塔">
    <div class="canvas-wrap">
      <canvas id="pyramid-canvas"></canvas>
      <div id="node-tooltip" class="node-tooltip" hidden></div>
    </div>
    <div class="tier-rail" id="tier-rail" aria-label="层级说明"></div>
  </section>
  <section class="detail-pane" id="detail">
    <header class="panel-global">
      <div class="panel-global-head">
        <h1>职业驱动的 OBE 架构</h1>
        <div class="panel-global-ctrl">
          <button type="button" class="ctrl-btn" id="btn-dir">↓ 正向拆解</button>
          <button type="button" class="ctrl-btn" id="btn-all-links">关系全景</button>
        </div>
      </div>
    </header>
    <div id="focus-body" class="panel-point">
      <p class="placeholder">共 1460 个实体 · 点击光点查看名称与关系链</p>
    </div>
  </section>
</div>

function getGlowSprite(stops) {
  const key = stops.map(s => s[0] + ':' + s[1]).join('|');
  if (_glowSpriteCache.has(key)) return _glowSpriteCache.get(key);
  const sz = 64;
  const oc = document.createElement('canvas');
  oc.width = oc.height = sz;
  const octx = oc.getContext('2d');
  const g = octx.createRadialGradient(sz/2, sz/2, 0, sz/2, sz/2, sz/2);
  for (const [pos, col] of stops) g.addColorStop(pos, col);
  octx.fillStyle = g;
  octx.fillRect(0, 0, sz, sz);
  _glowSpriteCache.set(key, oc);
  return oc;
}

function getNodeSprite(col, mode) {
  const key = col + '\0' + mode;
  if (_nodeSpriteCache.has(key)) return _nodeSpriteCache.get(key);
  const preset = fireflyPreset(mode);
  const baseR = 16;
  const glowMul = preset.glowMul ?? 3.6;

  const oc = document.createElement('canvas');

  const octx = oc.getContext('2d');
  const cx = sz / 2, cy = sz / 2;
  const R = baseR;

  const glowR = R * glowMul;
  const outer = octx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
  outer.addColorStop(0, hexToRgba(mixHex(col, "#fffef5", 0.25), 0.38));
  outer.addColorStop(0.2, hexToRgba(col, 0.18));
  outer.addColorStop(0.5, hexToRgba(col, 0.06));
  outer.addColorStop(1, "transparent");
  octx.fillStyle = outer;
  octx.beginPath();
  octx.arc(cx, cy, glowR, 0, Math.PI * 2);
  octx.fill();

  if (midWarm > 0.04) {
    const midR = R * 1.6;
    const mid = octx.createRadialGradient(cx, cy, R * 0.1, cx, cy, midR);
    mid.addColorStop(0, hexToRgba("#fffef5", midWarm * 0.45));
    mid.addColorStop(0.45, hexToRgba(col, midWarm * 0.35));
    mid.addColorStop(1, "transparent");
    octx.fillStyle = mid;
    octx.beginPath();
    octx.arc(cx, cy, midR, 0, Math.PI * 2);
    octx.fill();
  }

  if (glintW > 0.01) drawStarGlint(octx, cx, cy, R * 0.85, hexToRgba("#ffffff", 1), glintW * 0.7, 0);
  if (glintC > 0.01) drawStarGlint(octx, cx, cy, R * 0.7, hexToRgba(col, 1), glintC * 0.65, 0);

  if (coreMul > 0.05) {
    const coreR = R * coreMul;
    const core = octx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
    core.addColorStop(0, hexToRgba("#ffffff", 0.92));
    core.addColorStop(0.5, hexToRgba(col, 0.65));
    core.addColorStop(1, hexToRgba(col, 0.08));
    octx.fillStyle = core;
    octx.beginPath();
    octx.arc(cx, cy, coreR, 0, Math.PI * 2);
    octx.fill();
  }

  const result = { canvas: oc, baseR, sz };
  _nodeSpriteCache.set(key, result);
  return result;
}

function getLivingSourceBaseSprite(col, mode, axisDiamond) {
  const key = col + '\0LS\0' + mode + '\0' + (axisDiamond ? 1 : 0);
  if (_nodeSpriteCache.has(key)) return _nodeSpriteCache.get(key);
  const preset = fireflyPreset(mode);
  const warm = mixHex(col, "#ffffff", 0.48);
  const baseR = 16;
  const distMax = preset.orbitDistMax ?? 1.52;
  const fieldPad = preset.fieldPad ?? 0.22;
  const haloMul = preset.haloMul ?? 1.2;
  const corePin = preset.corePin ?? 0.22;
  const fieldR = baseR * (distMax + fieldPad);
  const sz = Math.ceil(fieldR * 2) + 4;
  const oc = document.createElement('canvas');
  oc.width = oc.height = sz;
  const octx = oc.getContext('2d');
  const cx = sz / 2, cy = sz / 2;

  octx.globalCompositeOperation = "lighter";

  const fieldG = octx.createRadialGradient(cx, cy, 0, cx, cy, fieldR);
  fieldG.addColorStop(0, hexToRgba(warm, 0.22));
  fieldG.addColorStop(0.28, hexToRgba(col, 0.15));
  fieldG.addColorStop(0.55, hexToRgba(col, 0.1));
  fieldG.addColorStop(0.78, hexToRgba(col, 0.055));
  fieldG.addColorStop(0.92, hexToRgba(col, 0.028));
  fieldG.addColorStop(1, "transparent");
  octx.fillStyle = fieldG;
  octx.beginPath();
  octx.arc(cx, cy, fieldR, 0, Math.PI * 2);
  octx.fill();

  const bridgeR = baseR * (haloMul + distMax) * 0.52;
  const bridgeG = octx.createRadialGradient(cx, cy, baseR * 0.15, cx, cy, bridgeR);
  bridgeG.addColorStop(0, hexToRgba(warm, 0.18));
  bridgeG.addColorStop(0.45, hexToRgba(col, 0.12));
  bridgeG.addColorStop(0.75, hexToRgba(col, 0.06));
  bridgeG.addColorStop(1, "transparent");
  octx.fillStyle = bridgeG;
  octx.beginPath();
  octx.arc(cx, cy, bridgeR, 0, Math.PI * 2);
  octx.fill();

  if (!axisDiamond) {
    const innerR = baseR * 0.68;
    const innerG = octx.createRadialGradient(cx, cy, 0, cx, cy, innerR);
    innerG.addColorStop(0, hexToRgba("#ffffff", 0.92));
    innerG.addColorStop(0.32, hexToRgba(warm, 0.72));
    innerG.addColorStop(0.62, hexToRgba(col, 0.32));
    innerG.addColorStop(1, "transparent");
    octx.fillStyle = innerG;
    octx.beginPath();
    octx.arc(cx, cy, innerR, 0, Math.PI * 2);
    octx.fill();

    const pinR = baseR * corePin;
    const pinG = octx.createRadialGradient(cx, cy, 0, cx, cy, pinR);
    pinG.addColorStop(0, hexToRgba("#ffffff", 1));
    pinG.addColorStop(0.55, hexToRgba(warm, 0.88));
    pinG.addColorStop(0.98, hexToRgba(col, 0.5));
    pinG.addColorStop(1, "transparent");
    octx.fillStyle = pinG;
    octx.beginPath();
    octx.arc(cx, cy, pinR, 0, Math.PI * 2);
    octx.fill();
  }

  const result = { canvas: oc, baseR, sz };
  _nodeSpriteCache.set(key, result);
  return result;
}

/** 第一步：五层金字塔（层号自下而上 T5→T1，与 OBE_TIERS.id 一致） */
const PYRAMID_LAYERS = [
  { tierId: 5, wing: "left", concepts: ["场景颗粒"] },
  { tierId: 5, wing: "right", concepts: ["知识颗粒"] },
  { tierId: 4, wing: "center", concepts: ["课组名称", "教学单元"] },

  { tierId: 2, wing: "right", concepts: ["能力模块"] },
  { tierId: 1, wing: "center", concepts: ["岗位"] },
];

function hashKey(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16).padStart(8, "0").slice(0, 10);
}

function conceptToTierWing(concept) {
  const row = PYRAMID_LAYERS.find(r => r.concepts.includes(concept));
  return row ? { tierId: row.tierId, wing: row.wing } : { tierId: 5, wing: "center" };
}

function resolveEntityId(concept, name) {
  return ENTITY_KEY_TO_ID.get(concept + "\0" + name) || null;
}

/** 对方实体所在金字塔层（tierId 1=塔尖 … 5=塔底） */
function peerTierId(concept, entityName) {
  const id = resolveEntityId(concept, entityName);
  const ent = id ? ENTITY_BY_ID.get(id) : null;
  if (ent && ent.tierId != null) return ent.tierId;
  return conceptToTierWing(concept).tierId;
}

/** -1 下层(塔底方向) · 0 同级 · 1 上层(塔尖方向)；tierId 小=塔尖 */
function tierDelta(anchorTier, peerTier) {
  if (peerTier > anchorTier) return -1;
  if (peerTier < anchorTier) return 1;
  return 0;
}

const SCENARIO_DOWN_CONCEPTS = new Set(["场景模块", "场景单元", "场景颗粒"]);
const KNOWLEDGE_DOWN_CONCEPTS = new Set(["能力模块", "知识单元", "知识颗粒"]);
/** 向下看隐藏/不连：项目化课、专业认知课、教学单元（岗位保留） */
const DOWN_HIDDEN_CONCEPTS = new Set(["项目化课", "专业认知课", "教学单元", "课组名称"]);
const DOWN_LINK_EXCLUDED = DOWN_HIDDEN_CONCEPTS;

/** 向下看：岗位↔模块 + 场景链 + 能力链（同翼内 + 同级） */
function downViewPeerAllowed(anchorConcept, peerConcept) {
  if (DOWN_LINK_EXCLUDED.has(peerConcept)) return false;
  if (DOWN_LINK_EXCLUDED.has(anchorConcept)) return false;
  if (anchorConcept === "岗位") {
    return peerConcept === "场景模块" || peerConcept === "能力模块";
  }
  if (peerConcept === "岗位") {
    return anchorConcept === "场景模块" || anchorConcept === "能力模块";
  }
  if (SCENARIO_DOWN_CONCEPTS.has(anchorConcept)) return SCENARIO_DOWN_CONCEPTS.has(peerConcept);
  if (KNOWLEDGE_DOWN_CONCEPTS.has(anchorConcept)) return KNOWLEDGE_DOWN_CONCEPTS.has(peerConcept);
  return false;
}

/** 向上看：下层入 + 上层出 + 同级；向下看：上层入 + 下层出 + 同级，且仅限左右两链 */
function includeOutLink(anchorTier, anchorConcept, targetConcept, targetName) {
  if (dir === "down" && !downViewPeerAllowed(anchorConcept, targetConcept)) return false;
  const d = tierDelta(anchorTier, peerTierId(targetConcept, targetName));
  if (d === 0) return true;
  return dir === "up" ? d > 0 : d < 0;
}

function includeInLink(anchorTier, anchorConcept, sourceConcept, sourceName) {
  if (dir === "down" && !downViewPeerAllowed(anchorConcept, sourceConcept)) return false;
  const d = tierDelta(anchorTier, peerTierId(sourceConcept, sourceName));
  if (d === 0) return true;
  return dir === "up" ? d < 0 : d > 0;
}

function filterRelOut(ent) {
  const anchorTier = ent.tierId;
  const anchorConcept = ent.concept;
  const out = {};
  for (const verb of Object.keys(ent.出 || {})) {
    const items = (ent.出[verb] || []).filter(t =>
      includeOutLink(anchorTier, anchorConcept, t.概念, t.实体)
    );
    if (items.length) out[verb] = items;
  }
  return out;
}

function filterRelIn(ent) {
  const anchorTier = ent.tierId;
  const anchorConcept = ent.concept;
  const inn = {};
  for (const verb of Object.keys(ent.入 || {})) {
    const items = (ent.入[verb] || []).filter(s =>
      includeInLink(anchorTier, anchorConcept, s.概念, s.实体)
    );
    if (items.length) inn[verb] = items;
  }
  return inn;
}

function countRel(rel) {
  return Object.values(rel || {}).reduce((s, a) => s + a.length, 0);
}

function viewDirLabel() {
  return dir === "up" ? "逆向追溯" : "正向拆解";
}

function viewDirRuleText() {
  return dir === "up"
    ? "下层入 · 上层出 · 同级"
    : "职业保留 · 场景/能力链向下（无项目化课·认知课·课组·教学单元）";
}

/** 按当前看法收集直接关联节点 id（一跳） */
function linkedIdsFromEntity(ent) {
  const ids = new Set();
  if (!ent) return ids;
  const anchorTier = ent.tierId;
  const anchorConcept = ent.concept;
  for (const verb of Object.keys(ent.出 || {})) {
    for (const t of ent.出[verb]) {
      if (!includeOutLink(anchorTier, anchorConcept, t.概念, t.实体)) continue;
      const tid = resolveEntityId(t.概念, t.实体);
      if (tid) ids.add(tid);
    }
  }
  for (const verb of Object.keys(ent.入 || {})) {
    for (const s of ent.入[verb]) {
      if (!includeInLink(anchorTier, anchorConcept, s.概念, s.实体)) continue;
      const sid = resolveEntityId(s.概念, s.实体);
      if (sid) ids.add(sid);
    }
  }
  return ids;
}

/**
 * 中轴特殊点聚焦 — 贯穿闭包（通用遍历，不按层写死）
 *
 * 逆向追溯（向上看）：
 * 1) 沿「出」向上 / 「入」向下：仅跨层且两端均为特殊点，队列只扩展特殊点。
 * 2) 链上各特殊点（聚焦点及本层以下）：只从该点自身出/入收录同级。
 * 3) 课组已在闭包时：补全 T5 颗粒 → T4 课组「耦合」入边（最后一公里，不升格特殊点）。
 *
 * 正向拆解（向下看）：中轴项目化课/认知/单元不展示，改走翼链
 * - 沿当前看法的出/入做全贯穿 BFS（岗位→场景/能力模块→单元→颗粒）；
 * - 路径上每个节点只补自身同级，不向整层扩散。
 *
 * 非特殊点锚：两种看法均用原全图 collectPenetrationViaIn / ViaOut。
 */
function nodeById(id) {
  if (!id || !DATA?.nodes) return null;
  return NODE_BY_ID.get(id) || null;
}

const AXIS_MILESTONE_CONCEPTS = new Set(["岗位", "项目化课", "专业认知课", "教学单元"]);
const GRANULE_CONCEPTS = new Set(["场景颗粒", "知识颗粒"]);

function penetrationAnchorIsSpecial(seedId) {
  const n = nodeById(seedId);
  if (n && isAxisMilestoneNode(n)) return true;
  const ent = ENTITY_BY_ID.get(seedId);
  return !!(ent && AXIS_MILESTONE_CONCEPTS.has(ent.concept));
}

function isCrossMilestoneEdge(fromN, toN) {
  if (!fromN || !toN) return false;
  return linkTierKind(fromN, toN) === "cross"
    && isAxisMilestoneNode(fromN) && isAxisMilestoneNode(toN);
}

function pushPenetrationEdge(edges, seen, nodeIds, fromId, toId, verb, isOut) {
  const key = fromId + "\0" + toId + "\0" + verb;
  if (seen.has(key)) return;
  seen.add(key);
  edges.push({ fromId, toId, verb, isOut });
  nodeIds.add(fromId);
  nodeIds.add(toId);
}

function penetrationEndpointsDrawable(fromN, toN) {
  const tf = nodeTierMeta(fromN);
  const tt = nodeTierMeta(toN);
  return isDrawableNode(fromN, tf) && isDrawableNode(toN, tt);
}

/** 向上（出）：跨层仅两端均为特殊点，BFS 只沿特殊点继续 */
function collectMilestoneCrossUp(seedId) {
  const nodeIds = new Set();
  const edges = [];
  const seen = new Set();
  const visited = new Set();
  if (!seedId) return { nodeIds, edges, seen };
  const queue = [seedId];
  visited.add(seedId);
  nodeIds.add(seedId);
  while (queue.length) {
    const id = queue.shift();
    const ent = ENTITY_BY_ID.get(id);
    if (!ent) continue;
    for (const verb of Object.keys(ent.出 || {})) {
      for (const t of ent.出[verb]) {
        if (!includeOutLink(ent.tierId, ent.concept, t.概念, t.实体)) continue;
        const toId = resolveEntityId(t.概念, t.实体);
        if (!toId) continue;
        const fromN = nodeById(id);
        const toN = nodeById(toId);
        if (!isCrossMilestoneEdge(fromN, toN) || !penetrationEndpointsDrawable(fromN, toN)) continue;
        pushPenetrationEdge(edges, seen, nodeIds, id, toId, verb, true);
        if (isAxisMilestoneNode(toN) && !visited.has(toId)) {
          visited.add(toId);
          queue.push(toId);
        }
      }
    }
  }
  return { nodeIds, edges, seen };
}

/** 向下（入）：跨层仅两端均为特殊点，BFS 只沿特殊点继续 */
function collectMilestoneCrossDown(seedId) {
  const nodeIds = new Set();
  const edges = [];
  const seen = new Set();
  const visited = new Set();
  if (!seedId) return { nodeIds, edges, seen };
  const queue = [seedId];
  visited.add(seedId);
  nodeIds.add(seedId);
  while (queue.length) {
    const id = queue.shift();
    const ent = ENTITY_BY_ID.get(id);
    if (!ent) continue;
    for (const verb of Object.keys(ent.入 || {})) {
      for (const s of ent.入[verb]) {
        if (!includeInLink(ent.tierId, ent.concept, s.概念, s.实体)) continue;
        const fromId = resolveEntityId(s.概念, s.实体);
        if (!fromId) continue;
        const fromN = nodeById(fromId);
        const toN = nodeById(id);
        if (!isCrossMilestoneEdge(fromN, toN) || !penetrationEndpointsDrawable(fromN, toN)) continue;
        pushPenetrationEdge(edges, seen, nodeIds, fromId, id, verb, false);
        if (isAxisMilestoneNode(fromN) && !visited.has(fromId)) {
          visited.add(fromId);
          queue.push(fromId);
        }
      }
    }
  }
  return { nodeIds, edges, seen };
}

function mergePenetrationParts(parts) {
  const nodeIds = new Set();
  const edges = [];
  const seen = new Set();
  for (const part of parts) {
    if (!part) continue;
    (part.nodeIds || []).forEach(id => nodeIds.add(id));
    for (const e of part.edges || []) {
      const key = e.fromId + "\0" + e.toId + "\0" + e.verb;
      if (seen.has(key)) continue;
      seen.add(key);
      edges.push(e);
    }
  }
  return { nodeIds, edges, seen };
}

/** 链上某一特殊点：仅该点自身的同级出/入（不扫全层、不连同级其它特殊点） */
function collectPeerEdgesAtMilestone(milestoneId, seen, edges, nodeIds) {
  const ent = ENTITY_BY_ID.get(milestoneId);
  if (!ent) return;
  for (const verb of Object.keys(ent.出 || {})) {
    for (const t of ent.出[verb]) {
      if (!includeOutLink(ent.tierId, ent.concept, t.概念, t.实体)) continue;
      const toId = resolveEntityId(t.概念, t.实体);
      if (!toId || toId === milestoneId) continue;
      const fromN = nodeById(milestoneId);
      const toN = nodeById(toId);
      if (!fromN || !toN || linkTierKind(fromN, toN) !== "peer") continue;
      if (!penetrationEndpointsDrawable(fromN, toN)) continue;
      pushPenetrationEdge(edges, seen, nodeIds, milestoneId, toId, verb, true);
    }
  }
  for (const verb of Object.keys(ent.入 || {})) {
    for (const s of ent.入[verb]) {
      if (!includeInLink(ent.tierId, ent.concept, s.概念, s.实体)) continue;
      const fromId = resolveEntityId(s.概念, s.实体);
      if (!fromId || fromId === milestoneId) continue;
      const fromN = nodeById(fromId);
      const toN = nodeById(milestoneId);
      if (!fromN || !toN || linkTierKind(fromN, toN) !== "peer") continue;
      if (!penetrationEndpointsDrawable(fromN, toN)) continue;
      pushPenetrationEdge(edges, seen, nodeIds, fromId, milestoneId, verb, false);
    }
  }
}

/** 跨层链上的特殊点 id（聚焦点及以上仅参与跨层；聚焦点及本层以下才补同级） */
function milestoneIdsForPeerOnChain(mergedNodeIds, seedId, anchorTier) {
  const ids = [];
  const seen = new Set();
  const add = (id) => {
    if (!id || seen.has(id)) return;
    const n = nodeById(id);
    if (!n || !isAxisMilestoneNode(n)) return;
    const ent = ENTITY_BY_ID.get(id);
    const t = ent?.tierId ?? nodeEntityTierId(n);
    if (anchorTier != null && t < anchorTier) return;
    seen.add(id);
    ids.push(id);
  };
  add(seedId);
  mergedNodeIds.forEach(id => add(id));
  ids.sort((a, b) => {
    const ta = ENTITY_BY_ID.get(a)?.tierId ?? 99;
    const tb = ENTITY_BY_ID.get(b)?.tierId ?? 99;
    return ta - tb;
  });
  return ids;
}

/** 课组已在闭包时：补全 T5 颗粒 → T4 课组「耦合」入边 */
function extendGranuleCouplingToCourseGroups(seen, edges, nodeIds) {
  const groupIds = [...nodeIds].filter(id => nodeById(id)?.type === "course_group");
  for (const groupId of groupIds) {
    const ent = ENTITY_BY_ID.get(groupId);
    if (!ent) continue;
    for (const verb of Object.keys(ent.入 || {})) {
      if (verb !== "耦合") continue;
      for (const s of ent.入[verb]) {
        if (!GRANULE_CONCEPTS.has(s.概念)) continue;
        if (!includeInLink(ent.tierId, ent.concept, s.概念, s.实体)) continue;
        const fromId = resolveEntityId(s.概念, s.实体);
        if (!fromId) continue;
        const fromN = nodeById(fromId);
        const toN = nodeById(groupId);
        if (!fromN || !toN || linkTierKind(fromN, toN) !== "cross") continue;
        const fromTier = ENTITY_BY_ID.get(fromId)?.tierId ?? nodeEntityTierId(fromN);
        if (fromTier !== 5) continue;
        if (!penetrationEndpointsDrawable(fromN, toN)) continue;
        pushPenetrationEdge(edges, seen, nodeIds, fromId, groupId, verb, false);
      }
    }
  }
}

function collectPenetrationViaIn(seedId) {
  const nodeIds = new Set();
  const edges = [];
  const seen = new Set();
  if (!seedId) return { nodeIds, edges };
  const queue = [seedId];
  nodeIds.add(seedId);
  while (queue.length) {
    const id = queue.shift();
    const ent = ENTITY_BY_ID.get(id);
    if (!ent) continue;
    for (const verb of Object.keys(ent.入 || {})) {
      for (const s of ent.入[verb]) {
        if (!includeInLink(ent.tierId, ent.concept, s.概念, s.实体)) continue;
        const fromId = resolveEntityId(s.概念, s.实体);
        if (!fromId) continue;
        const key = fromId + "\0" + id + "\0" + verb;
        if (!seen.has(key)) {
          seen.add(key);
          edges.push({ fromId, toId: id, verb, isOut: false });
        }
        nodeIds.add(fromId);
        nodeIds.add(id);
        queue.push(fromId);
      }
    }
  }
  return { nodeIds, edges };
}

function collectPenetrationViaOut(seedId) {
  const nodeIds = new Set();
  const edges = [];
  const seen = new Set();
  if (!seedId) return { nodeIds, edges };
  const queue = [seedId];
  nodeIds.add(seedId);
  while (queue.length) {
    const id = queue.shift();
    const ent = ENTITY_BY_ID.get(id);
    if (!ent) continue;
    for (const verb of Object.keys(ent.出 || {})) {
      for (const t of ent.出[verb]) {
        if (!includeOutLink(ent.tierId, ent.concept, t.概念, t.实体)) continue;
        const toId = resolveEntityId(t.概念, t.实体);
        if (!toId) continue;
        const key = id + "\0" + toId + "\0" + verb;
        if (!seen.has(key)) {
          seen.add(key);
          edges.push({ fromId: id, toId, verb, isOut: true });
        }
        nodeIds.add(id);
        nodeIds.add(toId);
        queue.push(toId);
      }
    }
  }
  return { nodeIds, edges };
}

/** 正向拆解：沿当前看法出/入贯穿翼链（岗位保留，不走中轴隐藏层） */
function collectDownViewWingPenetration(seedId) {
  return mergePenetrationParts([
    collectPenetrationViaOut(seedId),
    collectPenetrationViaIn(seedId),
  ]);
}

function collectPenetrationClosure(seedId) {
  if (!penetrationAnchorIsSpecial(seedId)) {
    const down = collectPenetrationViaIn(seedId);
    const up = collectPenetrationViaOut(seedId);
    const nodeIds = new Set([...down.nodeIds, ...up.nodeIds]);
    return { nodeIds, edges: [...down.edges, ...up.edges], restrictSpecialAnchor: false };
  }
  if (dir === "down") {
    const spread = collectDownViewWingPenetration(seedId);
    for (const id of spread.nodeIds) {
      collectPeerEdgesAtMilestone(id, spread.seen, spread.edges, spread.nodeIds);
    }
    return {
      nodeIds: spread.nodeIds,
      edges: spread.edges,
      restrictSpecialAnchor: true,
    };
  }
  const up = collectMilestoneCrossUp(seedId);
  const down = collectMilestoneCrossDown(seedId);
  const merged = mergePenetrationParts([up, down]);
  const anchorEnt = ENTITY_BY_ID.get(seedId);
  const anchorN = nodeById(seedId);
  const anchorTier = anchorEnt?.tierId ?? (anchorN ? nodeEntityTierId(anchorN) : null);
  for (const mid of milestoneIdsForPeerOnChain(merged.nodeIds, seedId, anchorTier)) {
    collectPeerEdgesAtMilestone(mid, merged.seen, merged.edges, merged.nodeIds);
  }
  extendGranuleCouplingToCourseGroups(merged.seen, merged.edges, merged.nodeIds);
  return {
    nodeIds: merged.nodeIds,
    edges: merged.edges,
    restrictSpecialAnchor: true,
  };
}

/**
 * 第一步～第四步：五层 → 分级 → 列实体 → 挂载出/入（连线在点击时按出/入动态绘制）
 */
function buildPyramidFromRelations(rel) {
  const idOf = new Map();
  const nodes = [];
  ENTITY_BY_ID = new Map();
  ENTITY_KEY_TO_ID = new Map();

  function nid(concept, name) {
    const k = concept + "\0" + name;
    if (!idOf.has(k)) {
      const meta = CONCEPT_META[concept];
      const tw = conceptToTierWing(concept);
      const id = `${meta.type}-${hashKey(k)}`;
      idOf.set(k, id);
      ENTITY_KEY_TO_ID.set(k, id);
      const node = {
        id,
        type: meta.type,
        level: meta.level,
        name,
        track: meta.track,
        concept,
        tierId: tw.tierId,
        wing: tw.wing,
      };
      nodes.push(node);
      ENTITY_BY_ID.set(id, {
        id,
        concept,
        name,
        tierId: tw.tierId,
        wing: tw.wing,
        出: {},
        入: {},
      });
    }
    return idOf.get(k);
  }

  /* 第二步 + 第三步：按层/翼收集实体列表 */
  const pyramid = [1, 2, 3, 4, 5].map(tierId => ({
    tierId,
    wings: {
      center: { concepts: [], entities: [] },
      left: { concepts: [], entities: [] },
      right: { concepts: [], entities: [] },
    },
  }));

  PYRAMID_LAYERS.forEach(row => {
    const slot = pyramid.find(p => p.tierId === row.tierId).wings[row.wing];
    row.concepts.forEach(c => {
      if (!slot.concepts.includes(c)) slot.concepts.push(c);
    });
  });

  const concepts = rel.meta?.概念 || Object.keys(rel.data || {});
  for (const concept of concepts) {
    const bucket = rel.data[concept] || {};
    for (const name of Object.keys(bucket)) {
      const id = nid(concept, name);
      const ent = ENTITY_BY_ID.get(id);
      const raw = bucket[name];
      ent.出 = raw.出 || {};
      ent.入 = raw.入 || raw.in || {};

      const tw = conceptToTierWing(concept);
      const slot = pyramid.find(p => p.tierId === tw.tierId).wings[tw.wing];
      slot.entities.push({ id, concept, name });
      /* 确保出/入指向的实体在节点表中有坐标 */
      for (const verb of Object.keys(ent.出 || {})) {
        for (const t of ent.出[verb]) nid(t.概念, t.实体);
      }
      for (const verb of Object.keys(ent.入 || {})) {
        for (const s of ent.入[verb]) nid(s.概念, s.实体);
      }
    }
  }

  const cognition = Object.keys(rel.data?.["专业认知课"] || {})[0] || "";
  return {
    meta: {
      title: rel.meta?.说明 || "OBE 实体关系",
      cognitionCourse: cognition,
      source: "dependance/exampleRelation.json",
      entityCount: rel.meta?.实体总数 ?? nodes.length,
      stats: { nodes: nodes.length, levels: 6 },
    },
    nodes,
    pyramid,
  };
}

  const pts = [];
  for (let i = 0; i < SIDES; i++) {

function rot3(p) {
  const { x, y, z } = p;
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  const cx = Math.cos(VIEW_PITCH), sx = Math.sin(VIEW_PITCH);
  const x1 = x * cy - z * sy;
  const z1 = x * sy + z * cy;
  const y1 = y * cx - z1 * sx;
  const z2 = y * sx + z1 * cx;
  return { x: x1, y: y1, z: z2 };
}

  return `<svg class="rel-svg rel-svg-block" viewBox="0 0 24 24" fill="none" aria-hidden="true">

}

function relSvgFold() {
  return `<svg class="rel-svg rel-svg-fold" viewBox="0 0 20 20" fill="none" aria-hidden="true">

function relFoldSlotHtml(hasFold) {

function relHeadLabel(direction) {
  const isIn = direction === "in";

  const sub = isIn

function relDirHint(direction) {

}

function linksToVerbGroups(links) {
  const order = [];
  const map = {};
  (links || []).forEach(l => {
    if (!map[l.verb]) {
      map[l.verb] = [];
      order.push(l.verb);
    }
    map[l.verb].push({ concept: l.concept, name: l.name || "" });
  });
  return order.map(verb => ({ verb, items: map[verb] }));
}

function relObjToVerbGroups(relObj) {
  return Object.keys(relObj || {}).map(verb => ({
    verb,
    items: (relObj[verb] || []).map(t => ({ concept: t.概念, name: t.实体 })),
  }));
}

function relChipHtml(item, direction) {

}

function relGroupsHtml(groups, direction) {
  if (!groups.length) return "";
  return `<div class="rel-groups">${groups.map(g => `
    <div class="rel-group">
      <span class="rel-verb">${esc(g.verb)}</span>

    </div>`).join("")}</div>`;
}

function formatUnifiedRelBlock(direction, groups, emptyText) {

  const body = groups.length
    ? relGroupsHtml(groups, direction)
    : `<div class="rel-empty">${emptyText}</div>`;

function renderRelFlow(inGroups, outGroups, opts) {
  opts = opts || {};
  const showEmpty = opts.showEmpty !== false;
  const blocks = [];
  if (showEmpty || inGroups.length) {
    blocks.push(formatUnifiedRelBlock("in", inGroups, opts.emptyIn || "本层为架构基底"));
  }
  if (showEmpty || outGroups.length) {
    blocks.push(formatUnifiedRelBlock("out", outGroups, opts.emptyOut || "本层为架构顶端"));
  }
  if (!blocks.length) return `<p class="rel-flow-empty">${opts.noRelText || "当前视图下无关联连线"}</p>`;
  return `<div class="rel-flow">${blocks.join("")}</div>`;

function isFocusRelMilestoneItem(item) {
  if (AXIS_MILESTONE_CONCEPTS.has(item.concept)) return true;
  const peerId = resolveEntityId(item.concept, item.name);
  const peerNode = peerId ? nodeById(peerId) : null;
  return !!(peerNode && isAxisMilestoneNode(peerNode));
}

function focusRelWingRank(item) {
  const wing = conceptToTierWing(item.concept).wing;
  return wing === "left" ? 0 : wing === "center" ? 1 : 2;
}

/** 特殊点优先；同组内左翼场景/能力在上、中轴居中、右翼知识在下 */
function sortFocusRelItems(items) {
  return [...items].sort((a, b) => {
    const am = isFocusRelMilestoneItem(a) ? 0 : 1;
    const bm = isFocusRelMilestoneItem(b) ? 0 : 1;
    if (am !== bm) return am - bm;
    const aw = focusRelWingRank(a);
    const bw = focusRelWingRank(b);
    if (aw !== bw) return aw - bw;
    return 0;
  });
}

function sortFocusRelGroups(groups) {
  return [...groups]
    .map(g => ({ verb: g.verb, items: sortFocusRelItems(g.items) }))
    .sort((a, b) => {
      const am = a.items.some(isFocusRelMilestoneItem) ? 0 : 1;
      const bm = b.items.some(isFocusRelMilestoneItem) ? 0 : 1;
      return am - bm;
    });
}

/** 承自下层：只沿「入」递归；指向顶层：只沿「出」递归 */
function buildFocusRelTree(ent, direction, visited) {
  if (!ent) return [];
  const byVerb = new Map();
  const rel = direction === "in" ? filterRelIn(ent) : filterRelOut(ent);
  for (const verb of Object.keys(rel)) {
    for (const item of rel[verb]) {
      if (!byVerb.has(verb)) byVerb.set(verb, []);
      const peerId = resolveEntityId(item.概念, item.实体);
      const peerEnt = peerId ? ENTITY_BY_ID.get(peerId) : null;
      const tierId = peerEnt?.tierId ?? peerTierId(item.概念, item.实体);
      let children = [];
      if (peerEnt && peerId && !visited.has(peerId)) {
        visited.add(peerId);
        children = buildFocusRelTree(peerEnt, direction, visited);
      }
      byVerb.get(verb).push({
        concept: item.概念,
        name: item.实体,
        tierId,
        children,
      });
    }
  }
  return sortFocusRelGroups([...byVerb.entries()].map(([verb, items]) => ({ verb, items })));
}

function renderFocusRelTreeItem(item, direction) {
  const chip = relChipHtml(item, direction);
  const hasKids = !!item.children?.length;
  if (!hasKids) {
    return `<div class="rel-tree-leaf">${relFoldSlotHtml(false)}${chip}</div>`;
  }
  const nested = renderFocusRelTreeGroups(item.children, direction);
  return `<details class="rel-tree-branch">
    <summary class="rel-tree-summary">
      ${relFoldSlotHtml(true)}
      ${chip}
    </summary>
    <div class="rel-nested">${nested}</div>
  </details>`;
}

function renderFocusRelTreeGroups(groups, direction) {
  if (!groups.length) return "";
  return groups.map(g => `
    <div class="rel-group">
      <span class="rel-verb">${esc(g.verb)}</span>
      <div class="rel-items">${g.items.map(it => renderFocusRelTreeItem(it, direction)).join("")}</div>
    </div>`).join("");
}

function formatUnifiedRelTreeBlock(direction, treeGroups, emptyText) {
  const cls = direction === "in" ? "rel-in" : "rel-out";
  const body = treeGroups.length
    ? `<div class="rel-groups">${renderFocusRelTreeGroups(treeGroups, direction)}</div>`
    : `<div class="rel-empty">${emptyText}</div>`;
  return `<div class="rel-block ${cls}">
    <div class="rel-head">${relHeadLabel(direction)}</div>
    <div class="rel-body">${body}</div>
  </div>`;
}


function renderFocusGraphUI(ent) {
  if (!ent) return `<p class="rel-flow-empty">—</p>`;
  relFlowGradSeq = 0;
  const inTree = buildFocusRelTree(ent, "in", new Set([ent.id]));
  const outTree = buildFocusRelTree(ent, "out", new Set([ent.id]));
  const blocks = [];
  if (inTree.length) blocks.push(formatUnifiedRelTreeBlock("in", inTree, "当前视图下无连线"));
  if (outTree.length) blocks.push(formatUnifiedRelTreeBlock("out", outTree, "当前视图下无连线"));
  if (!blocks.length) return `<p class="rel-flow-empty">当前视图下无关联连线</p>`;
  return `<div class="rel-flow">${blocks.join("")}</div>`;
}

function renderFocusBodyOverview() {
  if (!focusBody) return;
  const n = DATA?.meta?.entityCount ?? DATA?.nodes?.length ?? 0;
  focusBody.innerHTML = `<p class="placeholder">共 ${n} 个实体 · 点击光点查看名称与关系链</p>`;
}

function renderFocusBodyNode(node, ent) {

  focusBody.innerHTML = `
    <div class="panel-focus-head">
      <h4 class="entity-name">${entityDisplayTitleHtml(node)}</h4>
    </div>

function renderFocusBodyLayer(tierId) {

      <h4 class="entity-name">${esc(tierDisplayTitle(tierId))}</h4>
    </div>
    <p class="focus-graph-desc">点击本层光点，查看实体及其关系链</p>`;
}

function renderFocusBodyHidden(node) {

function updateDetailPanel(mode, opts) {

    else renderFocusBodyNode(opts.node, opts.ent);

}

function tierAt(lv) {
  return TIERS.find(t => t.lv === lv) || null;
}

function tierBody(id) {
  const t = tierAt(id);
  return t && !t.apex ? t : null;
}

function tierGeom(id) {
  return tierAt(id);
}

function tierGuideYm(tier) {
  if (tier.apex) return tier.y0 + (tier.y1 - tier.y0) * 0.12;
  return (tier.y0 + tier.y1) / 2;
}

function t1CapGeom() {
  const tier = tierAt(1);
  if (!tier) return null;
  const yMid = tierMidPlaneY(tier);
  return { tier, yFloor: yMid, yMid, rFloor: tier.r0 };
}

function lerpNum(a, b, t) { return a + (b - a) * t; }

function defocusProgress() {
  if (!defocusAnim) return 1;
  return Math.min(1, (performance.now() - defocusAnim.t0) / defocusAnim.dur);
}

function defocusEase() { return easeOutCubic(defocusProgress()); }

function defocusRelBlend() {
  if (activeNodeId && interactionMode === "node") return 1;
  if (linkDefocusActive()) return 1 - defocusEase();
  return 0;
}

function linkDefocusActive() {
  return !!(defocusAnim?.nodeId && defocusAnim.mode === "node" && defocusProgress() < 1);
}

function effectiveRelNodeId() {
  if (activeNodeId && interactionMode === "node") return activeNodeId;
  if (linkDefocusActive()) return defocusAnim.nodeId;
  return null;
}

function captureWeightSnapshot() {
  const snap = {};
  OBE_TIERS.forEach(obe => { snap[obe.id] = tierFocusWeight(obe.id); });
  return snap;
}

function updateModeBlend() {
  if (defocusAnim) {
    const p = defocusEase();
    modeBlend = lerpNum(defocusAnim.modeBlendAtExit ?? modeBlend, 0, p);
    if (p >= 1) modeBlend = 0;
    return;
  }
  if (!modeBlendAnim) {
    modeBlend = interactionMode === "node" ? 1 : 0;
    return;
  }
  const p = Math.min(1, (performance.now() - modeBlendAnim.t0) / modeBlendAnim.dur);
  const e = easeOutCubic(p);
  modeBlend = modeBlendAnim.from + (modeBlendAnim.to - modeBlendAnim.from) * e;
  if (p >= 1) modeBlendAnim = null;
}

function startModeBlend(toNode) {
  const to = toNode ? 1 : 0;
  if (Math.abs(modeBlend - to) < 0.02 && !modeBlendAnim) return;
  modeBlendAnim = {
    t0: performance.now(),
    dur: MODE_BLEND_MS,
    from: modeBlend,
    to,
  };
}

function isVisualTransitioning() {
  if (defocusAnim) return false;
  if (camAnim) return true;
  if (modeBlendAnim) return true;
  if (weightAnimT0 && performance.now() - weightAnimT0 < MODE_BLEND_MS) return true;
  return false;
}

function computeTierWeight(tierId) {
  if (defocusAnim) return 0.1;
  if (!focusLv) return 0.1;
  const wLayer = tierId === focusLv ? 1 : 0;
  let wNode = (tierId === focusLv - 1 || tierId === focusLv + 1) ? 1
    : tierId === focusLv ? 0.15 : 0;
  if (interactionMode === "node" && activeNodeId && pathLinkedTierIds?.has(tierId)) {
    wNode = tierId === focusLv ? 1 : 0.92;
  }
  return wLayer * (1 - modeBlend) + wNode * modeBlend;
}

function updateWeightAnim() {
  if (weightAnimT0 && performance.now() - weightAnimT0 >= MODE_BLEND_MS) weightAnimT0 = 0;
}

function startWeightAnim() {
  const snap = {};
  const dur = defocusAnim?.dur ?? MODE_BLEND_MS;
  const transitioning = weightAnimT0 && performance.now() - weightAnimT0 < dur;
  OBE_TIERS.forEach(obe => {
    const target = computeTierWeight(obe.id);
    let from = weightSnapshot?.[obe.id];
    if (defocusAnim?.weightSnap && defocusAnim.weightSnap[obe.id] != null) {
      from = defocusAnim.weightSnap[obe.id];
    } else if (!transitioning || from == null) {
      from = focusLv ? (obe.id === focusLv ? 0.55 : 0.06) : 0.1;
    }
    snap[obe.id] = from;
  });
  weightSnapshot = snap;
  weightAnimT0 = performance.now();
}

function tierFocusWeight(tierId) {
  const target = computeTierWeight(tierId);
  if (!weightAnimT0) return target;
  const dur = defocusAnim?.dur ?? MODE_BLEND_MS;
  const p = Math.min(1, (performance.now() - weightAnimT0) / dur);
  const e = easeOutCubic(p);
  const from = weightSnapshot?.[tierId] ?? target;
  return from + (target - from) * e;
}

function linkColorForWing(wing, track) {
  if (wing === "left" || track === "scenario") return LINK_LEFT;
  if (wing === "right" || track === "knowledge") return LINK_RIGHT;
  return LINK_CENTER;
}

function linkColorForEdge(e, pivotId) {
  if (!DATA) return LINK_CENTER;
  const pivot = NODE_BY_ID.get(pivotId);
  if (pivot) return linkColorForWing((nodeTierMeta(pivot) || {}).wing, pivot.track);
  const fromN = NODE_BY_ID.get(e.from);
  const tm = fromN ? nodeTierMeta(fromN) : null;
  return linkColorForWing(tm?.wing, fromN?.track);
}

const PYRAMID_SKIP_TYPES = new Set();

function isCenterEntity(n) {
  return n.type === "position" || n.type === "project_course"
    || n.type === "cognition_course" || n.type === "teaching_unit"
    || n.type === "course_group";
}

/** 中轴里程碑：岗位 / 项目化课 / 专业认知课 / 教学单元（菱形特殊造型） */
function isAxisMilestoneNode(n) {
  return n.type === "position" || n.type === "project_course"
    || n.type === "cognition_course" || n.type === "teaching_unit";
}

/** 向下看：不绘制、不可点中轴四类概念 */
function isDownViewHiddenNode(n) {
  return dir === "down" && DOWN_HIDDEN_CONCEPTS.has(n.concept);
}

function isDrawableNode(n, tm) {
  if (!tm) return false;
  if (PYRAMID_SKIP_TYPES.has(n.type)) return false;
  if (isDownViewHiddenNode(n)) return false;
  if (tm.wing !== "center") return true;
  return isCenterEntity(n);
}

function tierDisplayTitle(tierId) {
  const m = LV_META[String(tierId)];
  const obe = OBE_TIERS.find(t => t.id === tierId);
  if (dir !== "down" || !obe) return m.title;
  if (tierId === 1) return m.title;
  return obe.hint;
}

function relatedNodeIds(seedId) {
  return collectPenetrationClosure(seedId).nodeIds;
}

function refreshPathLinkedTiers(nodeId) {
  pathLinkedTierIds = null;
  if (!nodeId) return;
  const tiers = new Set();
  collectPenetrationClosure(nodeId).nodeIds.forEach(id => {
    const ent = ENTITY_BY_ID.get(id);
    if (ent?.tierId != null) tiers.add(ent.tierId);
  });
  pathLinkedTierIds = tiers;
}

function nodeEntityTierId(n) {
  const ent = ENTITY_BY_ID.get(n.id);
  if (ent?.tierId != null) return ent.tierId;
  const tm = nodeTierMeta(n);
  return tm?.id ?? null;
}

function linkTierKind(fromN, toN) {
  const a = nodeEntityTierId(fromN);
  const b = nodeEntityTierId(toN);
  if (a != null && b != null && a === b) return "peer";
  return "cross";
}

function setNodeLinkHighlight(id, anchorId, kind) {
  if (id === anchorId) {
    linkHighlightByNode.set(id, "anchor");
    return;
  }
  const cur = linkHighlightByNode.get(id);
  if (kind === "cross") linkHighlightByNode.set(id, "cross");
  else if (!cur || cur === "peer") linkHighlightByNode.set(id, "peer");
}

function linkHighlightClass(nodeId) {
  return linkHighlightByNode.get(nodeId) || null;
}

/** tierId 小=塔尖：目标端更高为向上（红） */
function crossTierLinkColor(fromN, toN) {
  const a = nodeEntityTierId(fromN);
  const b = nodeEntityTierId(toN);
  if (a == null || b == null) return LINK_CROSS_DOWN;
  return b < a ? LINK_CROSS_UP : LINK_CROSS_DOWN;
}

function bumpNodeAccent(id, hex) {
  const prev = linkNodeAccentColor.get(id);
  if (!prev || hex === LINK_CROSS_DOWN) linkNodeAccentColor.set(id, hex);
}

function axisMilestoneColor(node) {
  const tier = nodeEntityTierId(node) || 5;
  return AXIS_MILESTONE_COL[tier] || AXIS_MILESTONE_COL[5];
}

function radiusAtY(y) {
  if (y <= TIERS[0].y0) return TIERS[0].r0;
  for (const tier of TIERS) {
    if (y >= tier.y0 && y <= tier.y1) {
      const t = (y - tier.y0) / (tier.y1 - tier.y0);
      return tier.r0 * (1 - t) + tier.r1 * t;
    }
  }
  return 0;
}

function tierRadiusAtY(p, tier) {
  if (!tier || !p || p.y == null) return radiusAtY(p && p.y != null ? p.y : 0);
  const t = Math.max(0, Math.min(1, (p.y - tier.y0) / (tier.y1 - tier.y0)));
  return tier.r0 * (1 - t) + tier.r1 * t;
}

/**
 * 同层双台面（同一金字塔层内）：
 * · 下层翼轨 — 贴本层底留白（WING_FROM_BOTTOM）
 * · 中轴特殊点 — 本层几何中部
 */
/** 距本层底留白，避免光点贴住层间交界 */
const WING_FROM_BOTTOM = 0.13;
const WING_FROM_BOTTOM_FOCUS = 0.09;
const WING_SHELF_JIT = 0.01;
const CENTER_SHELF_JIT = 0.008;
const WING_RADIAL_IN = 0.42;
const WING_RADIAL_OUT = 0.96;
const CENTER_ZONE_R = 0.18;

function tierWingDeckY(tier) {
  if (!tier) return 0;
  const th = tier.y1 - tier.y0;
  const margin = focusLv === tier.lv ? WING_FROM_BOTTOM_FOCUS : WING_FROM_BOTTOM;
  return tier.y0 + th * margin;
}

function tierCenterDeckY(tier, deck) {
  if (!tier) return 0;
  const th = tier.y1 - tier.y0;
  if (deck === "upper") return tier.y0 + th * 0.72;
  if (deck === "bottom") {
    const margin = focusLv === tier.lv ? WING_FROM_BOTTOM_FOCUS : WING_FROM_BOTTOM;
    return tier.y0 + th * margin;
  }
  if (deck === "lower") return tier.y0 + th * 0.36;
  return (tier.y0 + tier.y1) * 0.5;
}

function tierMidPlaneY(tier) {
  return tierCenterDeckY(tier);
}

function tierFloorPlaneY(tier) {
  return tierWingDeckY(tier);
}

function clampTierDeckWing(p, tier, wing) {
  if (!tier) return p;
  const th = tier.y1 - tier.y0;
  const yW = tierWingDeckY(tier);
  const yBand = th * WING_SHELF_JIT;
  p.y = Math.max(yW - yBand, Math.min(yW + yBand, p.y));
  const rAt = radiusAtY(yW);
  const lim = rAt * 0.58;
  const zLim = lim * 0.92;
  const axisGap = rAt * CENTER_ZONE_R;
  if (wing === "left") {
    p.x = Math.max(-lim, Math.min(-axisGap, p.x));
  } else {
    p.x = Math.min(lim, Math.max(axisGap, p.x));
  }
  p.z = Math.max(-zLim, Math.min(zLim, p.z));
  const cheb = Math.max(Math.abs(p.x), Math.abs(p.z));
  if (cheb > lim) {
    const s = lim / cheb;
    p.x *= s;
    p.z *= s;
  }
  return p;
}

function clampTierDeckCenter(p, tier, deckY) {
  if (!tier) return p;
  const th = tier.y1 - tier.y0;
  const yC = deckY != null ? deckY : tierCenterDeckY(tier);
  const yBand = th * CENTER_SHELF_JIT;
  p.y = Math.max(yC - yBand, Math.min(yC + yBand, p.y));
  const rAt = radiusAtY(yC);
  const cap = rAt * 0.3;
  const cheb = Math.max(Math.abs(p.x), Math.abs(p.z));
  if (cheb > cap) {
    const s = cap / cheb;
    p.x *= s;
    p.z *= s;
  }
  return p;
}

function nodeTierMeta(node) {
  if (node._tm) return node._tm;
  for (const obe of OBE_TIERS) {
    if (!obe.nodeLevels.includes(node.level)) continue;
    if (obe.centerTypes.includes(node.type)) { node._tm = { id: obe.id, wing: "center" }; return node._tm; }
    if ((obe.leftTypes || []).includes(node.type)) { node._tm = { id: obe.id, wing: "left" }; return node._tm; }
    if ((obe.rightTypes || []).includes(node.type)) { node._tm = { id: obe.id, wing: "right" }; return node._tm; }
  }
  node._tm = null;
  return null;
}

function hash01(seed, salt) {
  let h = 2166136261;
  const s = seed + "|" + salt;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0) / 4294967296;
}

function layerSpread(tierId, focusTier, wingCount) {
  const n = wingCount || 4;
  const angBase = Math.min(1.35, 0.55 + n * 0.028);
  if (!focusTier) return { xOut: WING_RADIAL_OUT, xIn: WING_RADIAL_IN, ang: angBase };
  if (tierId === focusTier) {
    return { xOut: 0.96, xIn: 0.36, ang: Math.min(1.4, 0.52 + n * 0.03) };
  }
  if (Math.abs(tierId - focusTier) === 1) return { xOut: 0.92, xIn: 0.34, ang: angBase };
  return { xOut: 0.86, xIn: 0.32, ang: angBase * 0.92 };
}

function placeT1Positions(nodes, pos) {
  const cap = t1CapGeom();
  if (!cap || !nodes.length) return;
  placeCenterDeck(nodes, cap.tier, pos);
}

/* 上层台面：教学单元 / 认知课 / 项目化课；deckY 可指定 T4 内教学单元居上、课组贴层底 */
function placeCenterDeck(nodes, tier, pos, deckY) {
  const list = nodes.slice().sort((a, b) => a.id.localeCompare(b.id));
  const n = list.length;
  if (!n) return;
  const yC = deckY != null ? deckY : tierCenterDeckY(tier);
  const th = tier.y1 - tier.y0;
  const yJit = th * CENTER_SHELF_JIT;
  const rAt = radiusAtY(yC);
  const rZone = rAt * (n > 12 ? 0.38 : n > 5 ? 0.32 : 0.26);
  const minD = rAt * (n > 12 ? 0.09 : n > 5 ? 0.14 : 0.18);
  const placed = [];

  list.forEach((node, idx) => {
    let best = null;
    let bestScore = -1;
    const angBase = (idx / Math.max(n, 1)) * Math.PI * 2;
    for (let attempt = 0; attempt < 64; attempt++) {
      const u = hash01(node.id, "shelf:c:u:" + attempt);
      const v = hash01(node.id, "shelf:c:v:" + attempt);
      const w = hash01(node.id, "shelf:c:w:" + attempt);
      const ang = angBase + (u - 0.5) * 0.85;
      const rad = (0.35 + v * 0.65) * rZone;
      const p = {
        x: Math.cos(ang) * rad,
        y: yC + (w - 0.5) * yJit * 2,
        z: Math.sin(ang) * rad,
      };
      let score = 1;
      for (const q of placed) {
        const d = Math.hypot(p.x - q.x, p.z - q.z);
        if (d < minD) { score = 0; break; }
        score += Math.min(d, minD * 2);
      }
      if (score > bestScore) { bestScore = score; best = p; }
    }
    placed.push(best);
    pos[node.id] = clampTierDeckCenter(best, tier, yC);
  });
}

function t1FloorCenterScreen() {
  const cap = t1CapGeom();
  if (!cap) return null;
  return toScreen({ x: 0, y: cap.yFloor, z: 0 });
}

/* 下层台面：颗粒 / 场景·知识单元 / 模块 */
function placeWingDeck(nodes, wing, tier, pos, spread) {
  const n = nodes.length;
  if (!n) return;
  const th = tier.y1 - tier.y0;
  const yW = tierWingDeckY(tier);
  const yBand = th * WING_SHELF_JIT;
  const list = nodes.slice().sort((a, b) => a.id.localeCompare(b.id));
  const centerAng = wing === "left" ? Math.PI : 0;
  const angSpan = Math.PI * (spread.ang || 0.65);

  list.forEach((node, idx) => {
    const t = n === 1 ? 0.5 : idx / (n - 1);
    const ang = centerAng + (t - 0.5) * angSpan;
    const y = yW + (hash01(node.id, wing + ":y") - 0.5) * yBand;
    const rSurf = radiusAtY(yW);
    const axisGap = rSurf * 0.16;
    const xIn = Math.max(axisGap * 1.05, rSurf * spread.xIn);
    const xOut = rSurf * spread.xOut;
    const lane = hash01(node.id, wing + ":lane");
    const radial = xIn + (0.22 + lane * 0.76 + (idx % 3) * 0.03) * (xOut - xIn);
    const jitter = (hash01(node.id, wing + ":j") - 0.5) * angSpan * 0.03;
    const p = {
      x: Math.cos(ang + jitter) * radial,
      y,
      z: Math.sin(ang + jitter) * radial,
    };
    pos[node.id] = clampTierDeckWing(p, tier, wing);
  });
}

function buildNodePositions(focusTier) {
  const pos = {};
  if (!DATA || !DATA.nodes) return pos;
  OBE_TIERS.forEach(obe => {
    const tier = tierAt(obe.id);
    if (!tier) return;
    const left = DATA.nodes.filter(n => (obe.leftTypes || []).includes(n.type) && obe.nodeLevels.includes(n.level));
    const right = DATA.nodes.filter(n => (obe.rightTypes || []).includes(n.type) && obe.nodeLevels.includes(n.level));
    const centers = DATA.nodes.filter(
      n => obe.centerTypes.includes(n.type) && obe.nodeLevels.includes(n.level)
    );
    const sp = layerSpread(obe.id, focusTier, Math.max(left.length, right.length, 1));
    if (obe.id === 1) {
      placeT1Positions(DATA.nodes.filter(n => n.type === "position"), pos);
    } else if (obe.id === 4) {
      placeCenterDeck(centers.filter(n => n.type === "teaching_unit"), tier, pos, tierCenterDeckY(tier, "upper"));
      placeCenterDeck(centers.filter(n => n.type === "course_group"), tier, pos, tierCenterDeckY(tier, "bottom"));
    } else if (obe.id === 5) {
      placeWingDeck(left, "left", tier, pos, sp);
      placeWingDeck(right, "right", tier, pos, sp);
    } else {
      placeWingDeck(left, "left", tier, pos, sp);
      placeWingDeck(right, "right", tier, pos, sp);
      placeCenterDeck(centers, tier, pos);
    }
  });
  return pos;
}

function buildMeshes() {
  if (_meshCache) return _meshCache;
  const faces = [];
  TIERS.forEach(tier => {
    const bot = ring(tier.y0, tier.r0);
    const cols = LV_COLORS[tier.lv];
    if (tier.apex) {
      const peak = { x: 0, y: tier.y1, z: 0 };
      for (let i = 0; i < SIDES; i++) {
        const j = (i + 1) % SIDES;
        faces.push({
          lv: tier.lv, kind: "side",
          pts: [bot[i], bot[j], peak],
          fill: cols[1], stroke: cols[0],
        });
      }
      return;
    }
    const top = ring(tier.y1, tier.r1);
    for (let i = 0; i < SIDES; i++) {
      const j = (i + 1) % SIDES;
      faces.push({
        lv: tier.lv, kind: "side",
        pts: [bot[i], bot[j], top[j], top[i]],
        fill: cols[1], stroke: cols[0],
      });
    }
    faces.push({ lv: tier.lv, kind: "top", pts: top, fill: cols[0], stroke: cols[2] || cols[0] });
    if (tier.lv === 5) {
      faces.push({ lv: 5, kind: "base", pts: bot.slice().reverse(), fill: cols[2], stroke: cols[1] });
    }
  });
  _meshCache = faces;
  return faces;
}

function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInCubic(t) { return t * t * t; }
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/** 轨道动画时钟；镜头/拖视角/滚轮缩放期间冻结角度推进 */
const orbitSim = { acc: 0, wall: 0 };
let viewMotionUntil = 0;

function markViewChanging(ms = 380) {
  viewMotionUntil = performance.now() + ms;
}

function orbitAnimPaused() {
  return !!camAnim || dragging || performance.now() < viewMotionUntil;
}

function orbitSimTime() {
  const wall = performance.now() * 0.001;
  if (!orbitSim.wall) orbitSim.wall = wall;
  if (orbitAnimPaused()) {
    orbitSim.wall = wall;
    return orbitSim.acc;
  }
  const dt = Math.min(0.04, Math.max(0, wall - orbitSim.wall));
  orbitSim.wall = wall;
  orbitSim.acc += dt;
  return orbitSim.acc;
}

const CAM_ZOOM_MIN = 0.65;
const CAM_ZOOM_MAX = 2.4;

/* 层越高（越窄）略放大；聚焦拉近克制，便于看到上下邻层 */
function zoomForLv(tierId) {
  const base = 1.02 + (TIER_COUNT - tierId) * 0.2;
  if (focusLv !== tierId) return base;
  let z = base + 0.1;
  if (interactionMode === "node") z += 0.05;
  else if (interactionMode === "layer" && tierId >= 3) z += 0.04;
  return Math.min(z, 1.55);
}

/* 聚焦时视心略向塔身中部靠拢，避免只拍到单层 */
function cyOffForLv(lv, zoom) {
  if (!lv) return 0;
  const z = zoom ?? camZoom;
  const tier = TIERS.find(t => t.lv === lv);
  if (!tier) return 0;
  const ym = (tier.y0 + tier.y1) / 2;
  const pyramidMid = (TIERS[0].y0 + TIERS[TIERS.length - 1].y1) * 0.5;
  const pull = interactionMode === "node" ? 0.2 : focusLv ? 0.12 : 0;
  const y = ym * (1 - pull) + pyramidMid * pull;
  return y * Math.cos(VIEW_PITCH) * layoutScale * z;
}

function focusRole(tierId) {
  if (!focusLv) return "normal";
  const w = tierFocusWeight(tierId);
  if (w >= 0.72) return "core";
  if (w >= 0.28) return "adj";
  return "dim";
}

function viewScale() { return layoutScale * camZoom; }
function viewCy() { return layoutCy + camCyOff; }

function clampCamCyOff() {
  const span = layoutScale * camZoom * MODEL_H_TOTAL * Math.cos(VIEW_PITCH) * 0.55;
  camCyOff = Math.max(-span, Math.min(span, camCyOff));
}

function inFocusBand(lv) {
  if (!focusLv) return true;
  const r = focusRole(lv);
  return r === "core" || r === "adj";
}

function fixedTierLabelY(ym) {
  return viewCy() - ym * Math.cos(VIEW_PITCH) * viewScale();
}

function toScreen(p) {
  const r = rot3(p);
  const sc = viewScale(), cy = viewCy();
  return { x: layoutCx + r.x * sc, y: cy - r.y * sc, z: r.z };
}

function startCamAnim(z1, y1, dur, onDone) {
  camAnim = {
    t0: performance.now(), dur,
    z0: camZoom, z1,
    y0: camCyOff, y1,
    onDone: onDone || null,
  };
}

function updateCam() {
  if (!camAnim) return;
  const p = Math.min(1, (performance.now() - camAnim.t0) / camAnim.dur);
  const e = easeOutCubic(p);
  camZoom = camAnim.z0 + (camAnim.z1 - camAnim.z0) * e;
  camCyOff = camAnim.y0 + (camAnim.y1 - camAnim.y0) * e;
  if (p >= 1) {
    const done = camAnim.onDone;
    camAnim = null;
    if (done) done();
  }
}

function enterFocus(lv) {
  const prev = focusLv;
  if (!prev) {
    wasAutoSpin = autoSpin && !paused;
    paused = true;
    autoSpin = false;
  }
  orbitSim.wall = performance.now() * 0.001;
  focusLv = lv;
  activeLv = lv;
  const toZ = zoomForLv(lv);
  const toY = cyOffForLv(lv, toZ);
  if (!prev || camZoom < 1.2) {
    startCamAnim(toZ, toY, CAM_DUR_ZOOM);
  } else if (prev !== lv || Math.abs(camZoom - toZ) > 0.04) {
    camAnim = { t0: performance.now(), dur: CAM_DUR_PAN, z0: camZoom, z1: toZ, y0: camCyOff, y1: toY, onDone: null };
  }
  refreshNodeLayout();
}

function exitFocus() {
  if (!focusLv || defocusAnim) return;
  defocusAnim = {
    t0: performance.now(),
    dur: CAM_DUR_OUT,
    focusLv,
    nodeId: activeNodeId,
    mode: interactionMode,
    modeBlendAtExit: modeBlend,
    weightSnap: captureWeightSnapshot(),
  };
  activeNodeId = null;
  pathLinkedTierIds = null;
  highlightNodeIds = new Set();
  linkedCenterTiers = new Set();
  linkHighlightByNode.clear();
  linkNodeAccentColor.clear();
  interactionMode = "overview";
  modeBlendAnim = null;
  startWeightAnim();
  setViewMode("overview");
  updateDetailPanel("overview");
  startCamAnim(1, 0, CAM_DUR_OUT, () => {
    focusLv = null;
    defocusAnim = null;
    weightAnimT0 = 0;
    modeBlend = 0;
    refreshNodeLayout();
    if (wasAutoSpin) {
      autoSpin = true;
      paused = false;
    }
  });
}

function truncateName(s, n) {
  const t = String(s).replace(/\s+/g, " ");
  return t.length > n ? t.slice(0, n) + "…" : t;
}

function measureTextWidth(text, font) {
  const prev = ctx.font;

}

function labelBoxFromCenter(px, py, tw, pad, bh) {
  return { x: px - tw / 2 - pad, y: py - 15, w: tw + pad * 2, h: bh, cx: px, cy: py };
}

function labelRectsOverlap(a, b, margin) {
  margin = margin ?? LABEL_SLOT_MARGIN;
  return !(a.x + a.w + margin <= b.x || b.x + b.w + margin <= a.x
    || a.y + a.h + margin <= b.y || b.y + b.h + margin <= a.y);
}

function reserveLabelBox(box) {
  labelReservedRects.push(box);
}

function resetLabelPlacer() {
  labelPlacedRects = labelReservedRects.map(r => ({ ...r }));
}

function labelSlotFree(box) {
  return !labelPlacedRects.some(p => labelRectsOverlap(box, p));
}

function nodeLabelPriority(n) {
  if (n.id === activeNodeId) return 100;
  if (isAxisMilestoneNode(n)) return 80;
  if (n.type === "course_group") return 70;
  const lc = linkHighlightClass(n.id);
  if (lc === "cross") return 50;
  if (lc === "peer") return 30;
  return 10;
}

function findNodeLabelSlot(ax, ay, tw, pad, bh, lane, priority, opts) {
  opts = opts || {};
  const spread = lane || 1;
  const below = [
    { dx: 0, dy: 30 }, { dx: spread * 48, dy: 34 }, { dx: -spread * 48, dy: 34 },
    { dx: spread * 88, dy: 28 }, { dx: -spread * 88, dy: 28 }, { dx: 0, dy: 48 },
  ];
  const above = [
    { dx: spread * 58, dy: -24 }, { dx: spread * 92, dy: -16 }, { dx: spread * 126, dy: -8 },
    { dx: -spread * 58, dy: -24 }, { dx: spread * 58, dy: -46 }, { dx: spread * 92, dy: -40 },
    { dx: 0, dy: -54 }, { dx: spread * 150, dy: -12 }, { dx: -spread * 92, dy: -32 },
    { dx: spread * 44, dy: 16 }, { dx: -spread * 126, dy: -10 }, { dx: spread * 118, dy: -52 },
  ];
  const offsets = opts.preferBelow ? [...below, ...above] : above;
  for (const o of offsets) {
    const px = ax + o.dx, py = ay + o.dy;
    const box = labelBoxFromCenter(px, py, tw, pad, bh);
    if (labelSlotFree(box)) {
      labelPlacedRects.push(box);
      return { px, py, leader: Math.hypot(o.dx, o.dy) > 42 };
    }
  }
  const force = priority >= 100 || (priority >= 70 && opts.preferBelow);
  if (force) {
    const o = offsets[0];
    const px = ax + o.dx, py = ay + o.dy;
    const box = labelBoxFromCenter(px, py, tw, pad, bh);
    labelPlacedRects.push(box);
    return { px, py, leader: true };
  }
  return null;
}

function milestoneLabelCap() {
  return camZoom >= LABEL_ZOOM_DETAIL
    ? LABEL_MAX_MILESTONE_PER_CONCEPT + 2
    : LABEL_MAX_MILESTONE_PER_CONCEPT;
}

function capNodeLabelCandidates(list) {
  const tierOrd = new Map();
  const milestoneOrd = new Map();
  const shown = [];
  const hidden = [];
  const maxMilestone = milestoneLabelCap();
  list.sort((a, b) => b.priority - a.priority || b.s.z - a.s.z || a.s.y - b.s.y);
  list.forEach(c => {
    if (c.priority >= 100) { shown.push(c); return; }
    if (c.priority >= 70) {
      const wing = nodeTierMeta(c.n)?.wing ?? "center";
      const key = `${c.tierId ?? 0}|${c.n.concept}|${wing}`;
      const n = milestoneOrd.get(key) || 0;
      if (n >= maxMilestone) { hidden.push(c); return; }
      milestoneOrd.set(key, n + 1);
      shown.push(c);
      return;
    }
    if (c.priority >= 50) { shown.push(c); return; }
    const tid = c.tierId ?? 0;
    const n = tierOrd.get(tid) || 0;
    if (n >= LABEL_MAX_ORDINARY_PER_TIER) return;
    tierOrd.set(tid, n + 1);
    shown.push(c);
  });
  return { shown, hidden };
}

function buildLabelAggregates(hidden) {
  const groups = new Map();
  hidden.forEach(c => {
    const wing = nodeTierMeta(c.n)?.wing ?? "center";
    const key = `${c.tierId ?? 0}|${c.n.concept}|${wing}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(c);
  });
  const aggregates = [];
  groups.forEach(items => {
    if (items.length < LABEL_AGGREGATE_MIN) return;
    const xs = items.reduce((s, c) => s + c.s.x, 0) / items.length;
    const ys = items.reduce((s, c) => s + c.s.y, 0) / items.length;
    const concept = items[0].n.concept;
    const label = `${conceptDisplayName(concept)} ×${items.length}`;
    const font = "600 10px Outfit,sans-serif";
    const wing = nodeTierMeta(items[0].n)?.wing;
    const lane = wing === "right" ? 1 : wing === "left" ? -1 : 0;
    aggregates.push({
      isAggregate: true,
      label,
      font,
      s: { x: xs, y: ys, z: Math.max(...items.map(c => c.s.z)) },
      col: schemaConceptAccent(concept),
      lane,
      linkClass: "",
      isSel: false,
      priority: 75,
      tierId: items[0].tierId,
      tw: measureTextWidth(label, font),
    });
  });
  aggregates.sort((a, b) => b.s.z - a.s.z);
  return aggregates;
}

function tierColor(tierId) { return LV_COLORS[tierId]?.[0] || "#aaa"; }
/** 圆盘铺色：最暗色 + 轻混深底，隐约可见不抢节点 */
const TIER_DISK_BG = "#0a1020";
const TIER_DISK_ALPHA = {
  mainFill: 0.078, mainStroke: 0.09,
  wingFill: 0.088,
  axisFill: 0.055, axisStroke: 0.068,
  outerFill: 0.028, outerStroke: 0.048,
};
function tierDiskColor(tierLv) {
  const cols = LV_COLORS[tierLv];
  const raw = cols ? (cols[2] || cols[1] || cols[0]) : "#aaa";
  return mixHex(raw, TIER_DISK_BG, 0.58);
}
function wingSectorDiskColor(wing) {
  const raw = wing === "left" ? WING_NODE.left : WING_NODE.right;
  return mixHex(raw, TIER_DISK_BG, 0.42);
}

function mixHex(hexA, hexB, t) {
  const key = hexA + '\0' + hexB + '\0' + t;
  let v = _mixHexCache.get(key);
  if (v !== undefined) return v;
  const p = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const a = p(hexA), b = p(hexB);
  const m = a.map((v, i) => Math.round(v * (1 - t) + b[i] * t));
  v = "#" + m.map(v => v.toString(16).padStart(2, "0")).join("");
  _mixHexCache.set(key, v);
  return v;
}

/** 聚焦视觉：特殊点 anchor > 闭包内普通 > 闭包外 dim */
function wingNodeVisualMode(isSel, isCross, isPeer, isRelated, isOutOfRel, isMilestoneInRel) {
  if (isOutOfRel) return "dim";
  if (isSel || isMilestoneInRel) return "anchor";
  if (isCross) return "cross";
  if (isPeer) return "peer";
  if (isRelated) return "focus";
  return "browse";
}

function fireflyPhase(x, y) {
  return ((x * 0.031 + y * 0.047) % 1) * Math.PI * 2;
}

/** 四点星芒（萤火虫/星星感） */
function drawStarGlint(ctx, x, y, len, col, a, rot) {
  if (a < 0.02) return;
  ctx.save();
  ctx.strokeStyle = col;
  ctx.globalAlpha = a;
  ctx.lineWidth = 0.7;
  ctx.lineCap = "round";
  for (let i = 0; i < 4; i++) {
    const ang = rot + (Math.PI / 2) * i;
    const c = Math.cos(ang), s = Math.sin(ang);
    ctx.beginPath();
    ctx.moveTo(x + c * len * 0.2, y + s * len * 0.2);
    ctx.lineTo(x + c * len, y + s * len);
    ctx.stroke();
  }
  ctx.restore();
}

/** 聚焦态：温柔呼吸（慢、幅度小） */
function lightBreath(t, phase, reduced) {
  if (reduced) return { s: 1, b: 1 };
  const w = Math.sin(t * 1.45 + phase);
  const w2 = Math.sin(t * 2.2 + phase * 0.7) * 0.35;
  return { s: 0.97 + (w + w2) * 0.06, b: 0.9 + (w + w2) * 0.1 };
}

/** 稳定伪随机 [0,1)，用于每颗粒独立参数（同节点帧间一致） */
function glowHash01(a, b, c) {
  const x = Math.sin(a * 12.9898 + b * 78.233 + (c ?? 0) * 37.719) * 43758.5453;
  return x - Math.floor(x);
}

function glowPick(phase, i, slot, min, max) {
  return min + glowHash01(phase, i, slot) * (max - min);
}

/** 节点专属相位：仅依赖 id/翼别，视角旋转/缩放/聚焦时不变，避免轨道微粒参数帧间跳变 */
function nodeGlowPhase(nodeId, wing) {
  const key = nodeId + "\0" + (wing || "c");
  if (_glowPhaseCache.has(key)) return _glowPhaseCache.get(key);
  const wingSlot = wing === "left" ? 1 : wing === "right" ? 2 : 0;
  let seed = 0;
  const s = String(nodeId ?? "");
  for (let i = 0; i < s.length; i++) seed += s.charCodeAt(i) * (i + 1);
  const v = glowHash01(seed, wingSlot, 17) * Math.PI * 2;
  _glowPhaseCache.set(key, v);
  return v;
}

/** 每颗轨道微粒：大小 / 距离 / 角速 / 周期 / 起相位 均在上下限内随机 */
function particleOrbitTraits(phase, i, cfg) {
  return {
    sizeMul: glowPick(phase, i, 0, cfg.orbitSizeMin ?? 0.48, cfg.orbitSizeMax ?? 1.2),
    distMul: glowPick(phase, i, 1, cfg.orbitDistMin ?? 0.68, cfg.orbitDistMax ?? 1.48),
    speed: glowPick(phase, i, 2, cfg.orbitSpeedMin ?? 0.22, cfg.orbitSpeedMax ?? 1.45),
    period: glowPick(phase, i, 3, cfg.orbitPeriodMin ?? 2.6, cfg.orbitPeriodMax ?? 8.8),
    phaseOff: glowHash01(phase, i, 4),
    startAng: glowHash01(phase, i, 5) * Math.PI * 2,
    spawnW: glowPick(phase, i, 6, 0.09, 0.24),
    mergeW: glowPick(phase, i, 7, 0.12, 0.3),
  };
}

/** 轨道小光点：从中心生出 → 环绕 → 收回合并（各颗粒生命周期宽度可不同） */
function orbitSatelliteState(cycle, traits) {
  const spawn = traits?.spawnW ?? 0.16;
  const merge = traits?.mergeW ?? 0.22;
  const orbitEnd = 1 - merge;
  if (cycle < spawn) {
    const p = cycle / spawn;
    const e = easeInOutCubic(p);
    return { rad: e, alpha: p * 0.88, size: 0.3 + e * 0.7 };
  }
  if (cycle < orbitEnd) {
    const span = orbitEnd - spawn;
    const pulse = 0.8 + Math.sin((cycle - spawn) / span * Math.PI) * 0.16;
    return { rad: 1, alpha: pulse, size: 1 };
  }
  const p = (cycle - orbitEnd) / merge;
  const e = easeInCubic(p);
  return { rad: 1 - e, alpha: (1 - p) * 0.82, size: 1 - e * 0.5 };
}

/** 环绕段匀速转角；生出/合并只径向；角度在合并→再生时不回跳 */
function orbitSatelliteAngle(cycle, tr) {
  const spawn = tr.spawnW ?? 0.16;
  const merge = tr.mergeW ?? 0.22;
  const orbitEnd = 1 - merge;
  const orbitSpan = Math.max(0.001, orbitEnd - spawn);
  const endAng = tr.startAng + orbitSpan * tr.period * tr.speed;
  if (cycle < spawn) return endAng;
  if (cycle < orbitEnd) {
    return tr.startAng + (cycle - spawn) * tr.period * tr.speed;
  }
  return endAng;
}

/** 聚焦：温柔清晰光源 + 呼吸 + 轨道微粒 */
function drawLivingSourceGlow(x, y, R, col, alpha, cfg, br) {
  const t = cfg.t ?? 0;
  const phase = cfg.phase ?? 0;
  const reduced = !!cfg.reduced;
  const b = Math.min(1, br.b * alpha * (cfg.bright ?? 1));
  const warm = mixHex(col, "#ffffff", 0.48);
  const scale = br.s;

  ctx.save();
  ctx.translate(x, y);
  const prevOp = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = "lighter";

  const prevAlpha1 = ctx.globalAlpha;

  const lsSprite = getLivingSourceBaseSprite(col, cfg._mode || "focus", !!cfg.axisDiamond);
  const lsScale = R * scale / lsSprite.baseR;
  const lsD = lsSprite.sz * lsScale;
  ctx.globalAlpha = prevAlpha1 * b;
  ctx.drawImage(lsSprite.canvas, -lsD / 2, -lsD / 2, lsD, lsD);
  ctx.globalAlpha = prevAlpha1;

  if (!reduced) {
    const count = cfg.orbitCount ?? 5;
    const tOrbit = orbitSimTime();
    const bloomSprite = getGlowSprite([[0, hexToRgba(warm, 0.35)], [0.55, hexToRgba(col, 0.14)], [1, "transparent"]]);
    const coreSprite = getGlowSprite([[0, hexToRgba("#ffffff", 1)], [0.35, hexToRgba(warm, 0.72)], [0.7, hexToRgba(col, 0.28)], [1, "transparent"]]);
    for (let i = 0; i < count; i++) {
      const tr = particleOrbitTraits(phase, i, cfg);
      const cycle = ((tOrbit / tr.period) + tr.phaseOff) % 1;
      const st = orbitSatelliteState(cycle, tr);
      if (st.alpha < 0.04) continue;

      const ang = orbitSatelliteAngle(cycle, tr);
      const dist = R * tr.distMul * scale * st.rad;
      const sx = Math.cos(ang) * dist;
      const sy = Math.sin(ang) * dist;
      const dotR = R * 0.11 * st.size * tr.sizeMul;
      const dotA = b * st.alpha * (0.68 + glowHash01(phase, i, 9) * 0.28);
      const bloomR = dotR * 3.6;

      const bd = bloomR * 2;
      ctx.globalAlpha = prevAlpha1 * dotA;
      ctx.drawImage(bloomSprite, sx - bd / 2, sy - bd / 2, bd, bd);

      const cd = dotR * 2.6 * 2;
      ctx.drawImage(coreSprite, sx - cd / 2, sy - cd / 2, cd, cd);
    }
    ctx.globalAlpha = prevAlpha1;
  }

  ctx.globalCompositeOperation = prevOp;
  ctx.restore();
}

/** 萤火虫光体：浏览=朦胧星点；聚焦=呼吸光源 + 轨道微粒 */
function drawFireflyBody(x, y, R, col, alpha, cfg) {
  const phase = cfg.phase ?? 0;
  const t = cfg.t ?? 0;
  const br = cfg.breath ? lightBreath(t, phase, !!cfg.reduced) : { s: 1, b: 1 };

  if (_liteMode) {
    const ob = alpha;
    const coreR = R * 0.5;
    ctx.fillStyle = hexToRgba(col, 0.5 * ob);
    ctx.beginPath();
    ctx.arc(x, y, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = hexToRgba(mixHex(col, "#ffffff", 0.5), 0.85 * ob);
    ctx.beginPath();
    ctx.arc(x, y, coreR, 0, Math.PI * 2);
    ctx.fill();
    return;
  }

  if (cfg.sharpLight) {
    drawLivingSourceGlow(x, y, R, col, alpha, cfg, br);
    return;
  }

  const glowMul = cfg.glowMul ?? 3.6;
  const midWarm = cfg.midWarm ?? 0.35;
  const glintW = cfg.glintWhite ?? 0.14;
  const glintC = cfg.glintCol ?? 0.22;
  const coreMul = cfg.coreMul ?? 0.5;
  const ob = alpha;

  const glowR = R * glowMul;
  const outer = ctx.createRadialGradient(x, y, 0, x, y, glowR);
  outer.addColorStop(0, hexToRgba(mixHex(col, "#fffef5", 0.25), 0.38 * ob));
  outer.addColorStop(0.2, hexToRgba(col, 0.18 * ob));
  outer.addColorStop(0.5, hexToRgba(col, 0.06 * ob));
  outer.addColorStop(1, "transparent");
  ctx.fillStyle = outer;
  ctx.beginPath();
  ctx.arc(x, y, glowR, 0, Math.PI * 2);
  ctx.fill();

  if (midWarm > 0.04) {
    const midR = R * 1.6;
    const mid = ctx.createRadialGradient(x, y, R * 0.1, x, y, midR);
    mid.addColorStop(0, hexToRgba("#fffef5", midWarm * ob * 0.45));
    mid.addColorStop(0.45, hexToRgba(col, midWarm * 0.35 * ob));
    mid.addColorStop(1, "transparent");
    ctx.fillStyle = mid;
    ctx.beginPath();
    ctx.arc(x, y, midR, 0, Math.PI * 2);
    ctx.fill();
  }

  if (glintW > 0.01) {
    drawStarGlint(ctx, x, y, R * 0.85, hexToRgba("#ffffff", 1), glintW * alpha * 0.7, phase * 0.15);
  }
  if (glintC > 0.01) {
    drawStarGlint(ctx, x, y, R * 0.7, hexToRgba(col, 1), glintC * alpha * 0.65, phase * 0.3);
  }

  if (coreMul > 0.05) {
    const coreR = R * coreMul;
    const core = ctx.createRadialGradient(x, y, 0, x, y, coreR);
    core.addColorStop(0, hexToRgba("#ffffff", 0.92 * ob));
    core.addColorStop(0.5, hexToRgba(col, 0.65 * ob));
    core.addColorStop(1, hexToRgba(col, 0.08 * ob));
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(x, y, coreR, 0, Math.PI * 2);
    ctx.fill();
  }
}

function fireflyPreset(mode) {
  const living = {
    sharpLight: true, breath: true,

  };
  const P = {
