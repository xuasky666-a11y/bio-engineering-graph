    // ===== Three.js 3D =====

    let groupV1 = null, groupV2 = null, currentVersion = 1;
    function curMesh(n) { return currentVersion === 1 ? n.meshV1 : n.meshV2; }
    function curNodeMeshes() { return currentVersion === 1 ? nodeMeshesV1 : nodeMeshesV2; }
    function curHelix() { return currentVersion === 1 ? helixMeshes : helixMeshesV2; }
    const TH = 400, HELIX_EXT = 620, TURNS = 4.2;
    const layerY3 = [200, 100, 0, -100, -200];

    function nodeId(c, e) { return c + "::" + e; }
    function extractGraph(source) {
      const nodes = (source.nodes || []).map((n) => ({
        id: n.id, entity: n.name, concept: (source.layers || [])[n.layer] || "", layer: n.layer,
        attrs: n.attrs || {}, parents: n.parents || [], children: n.children || []
      }));
      const nodeIndex = new Map(nodes.map((n) => [n.id, n]));
      const edges = [];
      nodes.forEach((n) => (n.children || []).forEach((cid) => {
        if (nodeIndex.has(cid)) edges.push({ key: n.id + "->" + cid, from: n.id, to: cid, verb: "支撑" });
      }));
      return { nodes, edges, layers: source.layers || LAYERS.map((L) => L.name), nodeIndex };
    }
    function layout() {
      nodesByLayer = [[], [], [], [], []];
      graph.nodes.forEach((n) => nodesByLayer[n.layer].push(n));
      nodesByLayer.forEach((list) => {
        list.sort((a, b) => a.concept.localeCompare(b.concept, "zh") || a.entity.localeCompare(b.entity, "zh"));
        const N = list.length;
        list.forEach((n, i) => { n.theta0 = N === 1 ? -Math.PI / 2 : (i / N) * Math.PI * 2 - Math.PI / 2; });
      });
    }
    function helixR(y) {
      return 170;
    }
    function initThree() {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

      renderer.setSize(stageEl.clientWidth, stageEl.clientHeight);
      stageEl.appendChild(renderer.domElement);
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(40, stageEl.clientWidth / stageEl.clientHeight, 1, 5000);

      const dl2 = new THREE.DirectionalLight(0xdfe8ff, 0.4); dl2.position.set(-320, -180, 260); scene.add(dl2);
      towerGroup = new THREE.Group();
      scene.add(towerGroup);
      groupV1 = new THREE.Group(); groupV2 = new THREE.Group();
      towerGroup.add(groupV1); towerGroup.add(groupV2);
      raycaster = new THREE.Raycaster();
      ndc = new THREE.Vector2();
      buildTower();
      buildV2();
      groupV2.visible = false;
    }
    function tubeFrom(fn, color, radius) {
      const pts = [];
      for (let i = 0; i <= 220; i++) pts.push(fn(i / 220));
      const curve = new THREE.CatmullRomCurve3(pts);
      const geo = new THREE.TubeGeometry(curve, 260, radius, 12, false);
      const mat = new THREE.MeshStandardMaterial({ color, metalness: 0.25, roughness: 0.32, emissive: color, emissiveIntensity: 0.12 });
      return new THREE.Mesh(geo, mat);
    }
    function buildTower() {
      // 双螺线管
      const helixA = (t) => { const y = -HELIX_EXT + t * 2 * HELIX_EXT; const r = helixR(y); const th = t * TURNS * Math.PI * 2; return new THREE.Vector3(r * Math.cos(th), y, r * Math.sin(th)); };
      const helixB = (t) => { const y = -HELIX_EXT + t * 2 * HELIX_EXT; const r = helixR(y); const th = t * TURNS * Math.PI * 2 + Math.PI; return new THREE.Vector3(r * Math.cos(th), y, r * Math.sin(th)); };
      const tubeA = tubeFrom(helixA, 0x2563eb, 5.0);
      const tubeB = tubeFrom(helixB, 0x7c3aed, 5.0);
      helixMeshes = [tubeA, tubeB];
      groupV1.add(tubeA); groupV1.add(tubeB);
      // 碱基横档(白色细圆柱,与层环同材质感)
      const rungMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.1, roughness: 0.4, transparent: true, opacity: 0.9, emissive: 0xffffff, emissiveIntensity: 0.12 });
      const YAXIS = new THREE.Vector3(0, 1, 0);
      for (let i = 8; i < 220; i += 8) {
        const t = i / 220;
        const a = helixA(t), b = helixB(t);
        const dir = new THREE.Vector3().subVectors(b, a);
        const len = dir.length();
        const rung = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, len, 8), rungMat);
        rung.position.copy(a).add(b).multiplyScalar(0.5);
        rung.quaternion.setFromUnitVectors(YAXIS, dir.normalize());
        groupV1.add(rung);
      }
      // 层环 + 层盘
      LAYERS.forEach((L, li) => {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(L.r, 1.6, 10, 80), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.1, roughness: 0.4, transparent: true, opacity: 0.9, emissive: 0xffffff, emissiveIntensity: 0.15 }));
        ring.rotation.x = Math.PI / 2; ring.position.y = layerY3[li];
        groupV1.add(ring);
        const disc = new THREE.Mesh(new THREE.CircleGeometry(L.r, 56), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.06, side: THREE.DoubleSide }));
        disc.rotation.x = -Math.PI / 2; disc.position.y = layerY3[li];
        groupV1.add(disc);
        labelAnchors[li] = new THREE.Vector3(0, layerY3[li], 0);
      });
      // 节点球
      graph.nodes.forEach((n) => {
        const base = 6.2;
        const col = new THREE.Color(LAYER_COLORS[n.layer]);
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(base, 22, 18), new THREE.MeshStandardMaterial({ color: col, metalness: 0.2, roughness: 0.35, emissive: col, emissiveIntensity: 0.18 }));
        const r = LAYERS[n.layer].r;
        mesh.position.set(r * Math.cos(n.theta0), layerY3[n.layer], r * Math.sin(n.theta0));
        mesh.userData = { id: n.id, base };
        groupV1.add(mesh);
        nodeMeshesV1.push(mesh);
        n.meshV1 = mesh;
      });
      // 漂浮微粒
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(60 * 3);
      for (let i = 0; i < 60; i++) {
        pPos[i * 3] = (Math.sin(i * 127.1) * 43758.5453 % 1) * 700 - 350;
        pPos[i * 3 + 1] = (Math.sin(i * 311.7) * 12543.21 % 1) * 800 - 400;
        pPos[i * 3 + 2] = (Math.sin(i * 74.7) * 269.87 % 1) * 500 - 250;
      }
      pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0xaab4bf, size: 2.2, transparent: true, opacity: 0.4 })));
    }
    function makeRibbon(phase, color, opacity) {
      const SEG = 200, M = 12, W = 34, T = 12, R = 190, EXT = 950, TURN = 6;
      const pos = [], idx = [];
      for (let i = 0; i <= SEG; i++) {
        const t = i / SEG;
        const y = -EXT + t * 2 * EXT;
        const th = t * TURN * Math.PI * 2 + phase;
        const rx = Math.cos(th), rz = Math.sin(th);
        const cx = R * rx, cz = R * rz;
        for (let j = 0; j <= M; j++) {
          const u = (j / M) * Math.PI * 2;
          const wr = Math.cos(u) * T / 2, wy = Math.sin(u) * W / 2;
          pos.push(cx + rx * wr, y + wy, cz + rz * wr);
        }
      }
      for (let i = 0; i < SEG; i++) for (let j = 0; j < M; j++) {
        const a = i * (M + 1) + j, b = a + 1, c = a + M + 1, d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      g.computeVertexNormals();
      // FrontSide: 只渲染外壁, 内壁(截面)不画 → 有体积且体内干净
      return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, transparent: true, opacity, side: THREE.FrontSide, roughness: 0.3, metalness: 0.15, depthWrite: false }));
    }
    function hexGridPoints(radius, D) {
      const pts = [];
      const Rmax = Math.ceil(radius / (D * Math.sqrt(3) / 2)) + 1;
      for (let r = -Rmax; r <= Rmax; r++) for (let q = -Rmax; q <= Rmax; q++) {
        const x = D * (q + r / 2);
        const z = D * (Math.sqrt(3) / 2) * r;
        const d = Math.hypot(x, z);
        if (d <= radius) pts.push({ x, z, d });
      }
      pts.sort((a, b) => a.d - b.d);
      return pts;
    }
    function buildV2() {
      const ribA = makeRibbon(0, 0x257fe5, 0.5);
      const ribB = makeRibbon(Math.PI, 0x7e5ce5, 0.5);
      helixMeshesV2 = [ribA, ribB];
      groupV2.add(ribA); groupV2.add(ribB);
      // 每层 = 满铺六边形网格(空六边形描边) + 节点实心六边形;边对边+留缝
      const D = Math.sqrt(3) * HEX_R * 1.06;
      const hexGeo = new THREE.CylinderGeometry(HEX_R, HEX_R, 2.6, 6);
      nodesByLayer.forEach((list, li) => {
        const emptyMat = new THREE.LineBasicMaterial({ color: V2_GRAY[li], transparent: true, opacity: 0.35 });
        const all = hexGridPoints(160, D);
        const nodePts = all.slice(0, list.length);
        const nodeSet = new Set(nodePts.map((p) => p.x.toFixed(1) + "," + p.z.toFixed(1)));
        const posArr = [];
        all.forEach((p) => {
          if (nodeSet.has(p.x.toFixed(1) + "," + p.z.toFixed(1))) return;
          for (let k = 0; k < 6; k++) {
            const a1 = (k / 6) * Math.PI * 2, a2 = ((k + 1) / 6) * Math.PI * 2;
            posArr.push(p.x + HEX_R * Math.sin(a1), layerY3[li], p.z + HEX_R * Math.cos(a1), p.x + HEX_R * Math.sin(a2), layerY3[li], p.z + HEX_R * Math.cos(a2));
          }
        });
        const eg = new THREE.BufferGeometry();
        eg.setAttribute("position", new THREE.Float32BufferAttribute(posArr, 3));
        groupV2.add(new THREE.LineSegments(eg, emptyMat));
        list.forEach((n, i) => {
          const mesh = new THREE.Mesh(hexGeo, new THREE.MeshStandardMaterial({ color: V2_GRAY[li], transparent: true, opacity: 0.78, roughness: 0.3, metalness: 0.12 }));
          mesh.position.set(nodePts[i].x, layerY3[li], nodePts[i].z);
          mesh.rotation.y = 0;
          mesh.userData = { id: n.id, base: HEX_R, layer: li };
          groupV2.add(mesh);
          nodeMeshesV2.push(mesh);
          n.meshV2 = mesh;
        });
      });
    }
    function applyV2Highlight() {
      const rel = new Set();
      if (selectedId) graph.edges.forEach((e) => { if (e.from === selectedId) rel.add(e.to); if (e.to === selectedId) rel.add(e.from); });
      nodeMeshesV2.forEach((m) => {
        m.children.slice().forEach((c) => m.remove(c));
        const id = m.userData.id;
        const ly = m.userData.layer || 0;
        const hi = id === selectedId || id === hoverId;
        if (hi || rel.has(id)) m.material.color.setHex(V2_SAT[ly]);
        else m.material.color.setHex(V2_GRAY[ly]);
        if (hi || rel.has(id)) {
          const ring = new THREE.Mesh(new THREE.TorusGeometry(HEX_R, 2.4, 6, 6), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
          ring.rotation.order = "YXZ";
          ring.rotation.x = Math.PI / 2;
          ring.rotation.y = -Math.PI / 2;
          m.add(ring);
        }
      });
    }
    function setVersion(v) {
      if (currentVersion === v) return;
      currentVersion = v;
      groupV1.visible = v === 1;
      groupV2.visible = v === 2;
      tiltX = v === 1 ? 0.16 : 0.85;
      document.body.classList.toggle("v2", v === 2);
      document.querySelectorAll(".ver-btn").forEach((b) => b.classList.toggle("active", parseInt(b.dataset.v, 10) === v));
      hoverId = null; hoverBall = false;
      layerLabelDivs = [];
      rebuildLinks();
    }
    function rebuildLinks() {
      if (linkGroup) { towerGroup.remove(linkGroup); linkGroup = null; }
      linkDots = [];
      rebuildNodeLabels();
      applyV2Highlight();
      if (!selectedId) return;
      linkGroup = new THREE.Group();
      graph.edges.forEach((e) => {
        if (e.from !== selectedId && e.to !== selectedId) return;
        const a = curMesh(graph.nodeIndex.get(e.from)), b = curMesh(graph.nodeIndex.get(e.to));
        if (!a || !b) return;
        const col = new THREE.Color(LAYER_COLORS_BRIGHT[graph.nodeIndex.get(selectedId).layer]);
        linkGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a.position, b.position]), new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.75 })));
        const dot = new THREE.Mesh(new THREE.SphereGeometry(1.6, 10, 8), new THREE.MeshBasicMaterial({ color: col }));
        linkGroup.add(dot);
        linkDots.push({ dot, a: a.position, b: b.position, t: Math.random() });
      });
      towerGroup.add(linkGroup);
    }
    function rebuildNodeLabels() {
      nodeLabelsEl.innerHTML = "";
      nodeLabelEls = [];
      if (!selectedId) return;
      const rel = new Set();
      graph.edges.forEach((e) => { if (e.from === selectedId) rel.add(e.to); if (e.to === selectedId) rel.add(e.from); });
      rel.forEach((id) => {
        const n = graph.nodeIndex.get(id);
        const m = curMesh(n);
        if (!n || !m) return;
        const el = document.createElement("div");
        el.className = "node-label";
        el.innerHTML = '<i style="background:' + LAYER_COLORS_BRIGHT[n.layer] + '"></i>' + n.entity;
        nodeLabelsEl.appendChild(el);
        nodeLabelEls.push({ el, mesh: m });
      });
    }
    function updateNodeLabelPos() {
      if (!nodeLabelEls.length) return;
      const w = stageEl.clientWidth, h = stageEl.clientHeight;
      const v = new THREE.Vector3();
      nodeLabelEls.forEach((it) => {
        v.copy(it.mesh.position);
        towerGroup.localToWorld(v);
        v.project(camera);
        it.el.style.left = ((v.x + 1) / 2 * w).toFixed(0) + "px";
        it.el.style.top = ((1 - v.y) / 2 * h).toFixed(0) + "px";
      });
    }
    let layerLabelDivs = [];
    function updateLayerLabelsPos() {
      const h = stageEl.clientHeight;
      if (!layerLabelDivs.length) {
        let html = "";
        LAYERS.forEach((L, li) => {
          const dotColor = currentVersion === 2 ? "#" + V2_GRAY[li].toString(16).padStart(6, "0") : LAYER_COLORS[li];
          html += '<div class="layer-label"><i class="ldot" style="background:' + dotColor + '"></i><span class="lname">' + L.name + '</span><span class="lcount">' + nodesByLayer[li].length + '</span></div>';
        });
        layerLabelsEl.innerHTML = html;
        layerLabelDivs = Array.from(layerLabelsEl.children);
      }
      LAYERS.forEach((L, li) => {
        const v = labelAnchors[li].clone();
        towerGroup.localToWorld(v);
        v.project(camera);
        layerLabelDivs[li].style.top = ((1 - v.y) / 2 * h).toFixed(0) + "px";
      });
    }
    function pickAt(clientX, clientY) {
      const rect = stageEl.getBoundingClientRect();
      ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      const hits = raycaster.intersectObjects(curNodeMeshes());
      return hits.length ? hits[0].object.userData.id : null;

    function tick(now) {
      const dt = Math.min(40, now - lastFrame);
      lastFrame = now; animTime = now;
      if (!dragState) spin += speed * dt * (hoverBall ? 0.15 : 1);
      towerGroup.rotation.y = spin;
      towerGroup.rotation.x = tiltX;
      // hover 射线
      let hid = null;
      if (mouse.in && !dragState) hid = pickAt(mouse.vx, mouse.vy);
      const hb = !!hid;
      if (hb !== hoverBall || hid !== hoverId) {
        hoverBall = hb; hoverId = hid;
        curNodeMeshes().forEach((m) => {
          const isH = m.userData.id === hoverId, isS = m.userData.id === selectedId;
          const hi2 = isS || (currentVersion === 2 && isH);
          m.scale.setScalar(hi2 ? 1.55 : isH ? 1.35 : 1);
          m.material.emissiveIntensity = hi2 ? 0.5 : isH ? 0.4 : 0.18;
        });
        if (currentVersion === 2) applyV2Highlight();
      }
      if (hid && hid !== selectedId) {
        const n = graph.nodeIndex.get(hid);
        tooltipEl.textContent = graph.layers[n.layer] + ":" + n.entity;
        tooltipEl.classList.add("show");
        tooltipEl.style.left = mouse.vx + 14 + "px";
        tooltipEl.style.top = mouse.vy + 14 + "px";
      } else tooltipEl.classList.remove("show");
      // 飞线光点
      linkDots.forEach((d) => { d.t = (d.t + dt * 0.0007) % 1; d.dot.position.lerpVectors(d.a, d.b, d.t); });
      updateLayerLabelsPos();
      updateNodeLabelPos();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    function onResize() {
      const w = stageEl.clientWidth, h = stageEl.clientHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    // ===== 弹窗(苹果风) =====
    function renderFocusPanel() {
      if (!selectedId) {
        let html = '<h2>生物工程专业图谱 · 总览</h2><div class="fp-concept" style="color:#047857">DUT · SCHOOL OF BIOENGINEERING</div>'
          + '<div class="fp-stats">'
          + LAYERS.map((L, li) => '<div class="fp-stat"><b>' + nodesByLayer[li].length + '</b><span>' + L.name + '</span></div>').join("")
          + '<div class="fp-stat"><b>' + graph.edges.length + '</b><span>支撑关系</span></div>'
          + '</div><div class="fp-layers">';
        LAYERS.forEach((L, li) => {
          html += '<div class="fp-layer"><i style="background:' + LAYER_COLORS_BRIGHT[li] + '"></i><span class="fp-ln">' + L.name + '</span><span class="fp-lc">' + nodesByLayer[li].length + '</span></div>';
        });
        html += '</div><div class="fp-tip">点击任意节点查看其自身信息与父/子级关系;列表项可点击跳转。</div>';
        focusPanelEl.innerHTML = html;
        return;
      }
      const n = graph.nodeIndex.get(selectedId);
      let html = '<h3>' + n.entity + '</h3><div class="np-concept" style="color:' + LAYER_COLORS_BRIGHT[n.layer] + '">' + (graph.layers[n.layer] || "") + ' · L' + n.layer + '</div>';
      const attrs = Object.entries(n.attrs || {});
      if (attrs.length) {
        html += '<div class="np-attrs">' + attrs.map(([k, v]) => '<div class="np-attr"><span class="np-attr-k">' + k + '</span><span class="np-attr-v">' + v + '</span></div>').join("") + '</div>';
      }
      const relList = (title, ids) => {
        const list = (ids || []).map((id) => graph.nodeIndex.get(id)).filter(Boolean);
        let s = '<div class="np-rel"><div class="np-verb" style="color:' + LAYER_COLORS_BRIGHT[n.layer] + '">' + title + '(' + list.length + ')</div>';
        if (!list.length) s += '<div class="np-none">无</div>';
        else s += '<ul>' + list.map((t) => '<li data-id="' + t.id + '" class="np-link">' + t.entity + '</li>').join("") + '</ul>';
        return s + '</div>';
      };
      html += relList("父级节点", n.parents) + relList("子级节点", n.children);
      html += '<div class="fp-tip">点击空白处返回总览;列表项可点击跳转。</div>';
      focusPanelEl.innerHTML = html;
    }
    function openPopover(id) { selectedId = id; rebuildLinks(); renderFocusPanel(); }
    function closePopover() { selectedId = null; rebuildLinks(); renderFocusPanel(); }

    // ===== 交互 =====
    stageEl.addEventListener("pointerdown", (e) => {
      dragState = { x: e.clientX, y: e.clientY, spin, tiltX };
      stageEl.classList.add("dragging");
      stageEl.setPointerCapture(e.pointerId);
    });
    stageEl.addEventListener("pointermove", (e) => {
      mouse.vx = e.clientX; mouse.vy = e.clientY; mouse.in = true;
      const rect = stageEl.getBoundingClientRect();
      mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
      if (!dragState) return;
      spin = dragState.spin + (e.clientX - dragState.x) * 0.005;
      tiltX = Math.max(0.05, Math.min(1.2, dragState.tiltX + (e.clientY - dragState.y) * 0.0012));
    });
    stageEl.addEventListener("pointerup", (e) => {
      if (dragState) {
        const dx = e.clientX - dragState.x, dy = e.clientY - dragState.y;
        if (dx * dx + dy * dy < 25) {
          const id = pickAt(e.clientX, e.clientY);
          if (id) openPopover(id); else closePopover();
        }
      }
      dragState = null; stageEl.classList.remove("dragging");
    });
    stageEl.addEventListener("mouseleave", () => { mouse.in = false; });
    focusPanelEl.addEventListener("click", (e) => {
      const li = e.target.closest && e.target.closest(".np-link");
      if (li && li.dataset.id) openPopover(li.dataset.id);
    });
    function pickHelix(clientX, clientY) {
      const rect = stageEl.getBoundingClientRect();
      ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      return raycaster.intersectObjects(curHelix()).length > 0;
    }
    stageEl.addEventListener("mousemove", (e) => {
      mouse.vx = e.clientX; mouse.vy = e.clientY; mouse.in = true;
      const rect = stageEl.getBoundingClientRect();
      mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top;
      const id = pickAt(e.clientX, e.clientY);
      stageEl.style.cursor = id ? "pointer" : (pickHelix(e.clientX, e.clientY) ? "grab" : "default");
    });
    window.addEventListener("resize", onResize);

    function init() {
      if (!raw || !raw.nodes) throw new Error("OBE_RELATION_DATA 缺失");
      graph = extractGraph(raw);
      graph.nodeIndex = new Map(graph.nodes.map((n) => [n.id, n]));
      layout();
      initThree();
      selectedId = null;
      focusPanelEl.classList.add("open");
      renderFocusPanel();
      document.getElementById("verSwitch").addEventListener("click", (e) => {
        const v = e.target && e.target.dataset ? parseInt(e.target.dataset.v, 10) : 0;
        if (v === 1 || v === 2) setVersion(v);
      });
      setVersion(2);
      requestAnimationFrame(tick);
    }
    init();
  </script>
</body>
</html>
